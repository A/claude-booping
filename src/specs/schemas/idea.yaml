# idea: specs/idea/<NNNN>-<slug>.md — what is proposed, the cheapest check that
# gives a verdict, and the verdict once checked. The status enum lists the open status
# first: `booping status` counts ideas in it as open.
doc: idea

rules:
  - select: FRONTMATTER
    has:
      type: idea
      title: '^.+$'
      summary: '^.{1,200}$'
      created_by: { enum: [owner, claude] }
      created_at: '^\d{4}-\d{2}-\d{2}$'
      updated_at: '^\d{4}-\d{2}-\d{2}$'
      status: { enum: [open, validating, accepted, rejected] }

  - select: H2
    ordered: [Idea, How to check, Verdict?]
    strict: true

  - select: SECTION("Idea") > P
    min: 1

  - select: SECTION("How to check") > UL > LI
    min: 1

  - select: SECTION("Verdict") > P
    optional: true
    min: 1
