# Vault-home base for per-project vaults (`<home_dir>/<project>/`). Raw string;
# `~` is expanded at vault-resolution time. Override globally at
# ${XDG_CONFIG_HOME:-~/.config}/booping/config.yaml. A `.booping` `vault_path:`
# marker still wins over this. Set in the project tier it has no effect (the vault
# is already resolved by then). Top-level because it resolves the vault before any
# namespace is reachable.
home_dir: ~/Claude/

# Everything the shipped playbook set owns. Placement rule: a key one playbook
# owns lives at `core.{name}_playbook`; a key the development loop or several
# playbooks share sits directly under `core`. A user's own playbook namespace
# copies this shape.
core:
  # Agent an assisted playbook step delegates its heavy reads to.
  research_agent: "booping:booping-researcher"

  # What a render does when the vault is behind on migrations. `true` (also when
  # no tier sets it): the render prints an order for the driving agent to run
  # `/playbook migrate` unattended and then resume the original request, and the
  # `migrate` playbook applies the pending set without asking for its up-front
  # approval. `false`: the render stops and tells the user to run `/playbook migrate`,
  # which asks before applying. Read by every render surface and by `migrate`, so
  # it sits directly under `core`.
  auto_migrate: true

  # How much a run decides without the user. `supervised` (also when no tier sets
  # it): every review gate stops and waits for the user, and step questions are
  # asked. `autonomous`: the driver presents each gate's receipt, confirms it
  # itself, settles step questions with the recommended option, and logs each as a
  # `defaults.md` entry through `booping defaults add`. Any other value stops every
  # render surface. Read by the driving protocol, `specs` and `migrate`, so it sits
  # directly under `core`.
  autonomy: supervised

  # Shell-outs a template body may call by dotted path: `{{ macro('core.macros.date', '+%H:%M') }}`.
  # Each value is an argv list (never a shell string) run with shell=False, or a mapping carrying
  # that list under `command:` plus an optional `cwd:` of `repo` or `vault` naming the directory
  # it runs in (omitted → the process cwd). The list is a prefix — call-site positional arguments
  # append to it. stdout is stripped and cached per argv tuple and resolved cwd for the process,
  # so a macro must be idempotent within one render and two argument variants are two runs.
  # `--stub-macro <path>[ <args>]=<literal>` on `render`, `render-playbook` and `scaffold`
  # returns the literal without executing.
  macros:
    date: ["date"]
    git_commit:
      command: ["git", "rev-parse", "HEAD"]
      cwd: repo

  # A **query spec** is any mapping in the merged config, addressed by its dotted
  # path — `booping query --config <dotted.path>` and `{{ '<dotted.path>' | query }}`.
  # Keys, all optional:
  #
  #   glob:    ordered list of vault-relative glob patterns. The first pattern to
  #            claim a slug wins, so precedence is list order. A slug is the parent
  #            directory name when the pattern's last segment is a literal filename
  #            (`plans/*/index.md` -> `alpha`), else the file stem. Omitted -> the
  #            `core.plans.glob` default below.
  #   root:    which directory the globs resolve against. Omitted -> the vault;
  #            `core` -> the plugin root, for content the plugin itself ships
  #            (`core.migrate_playbook.queries.pending` below), which makes the
  #            spec resolvable outside any project.
  #   where:   mapping of clause -> value. The clause key carries its operator as a
  #            suffix: `k` equality, `k!` inequality, `k:in` membership in a list,
  #            `k:gt` / `k:lt` numeric ordering (both operands must coerce to a
  #            number; one that does not fails the clause). A row missing the field
  #            fails every operator.
  #   sort:    frontmatter field name, `-` prefixed for descending. Rows without a
  #            value come last. Omitted -> slug order.
  #   columns: projection, declared order preserved. `path` and `slug` are always
  #            present. Sorting happens before projection, so a sort field need not
  #            be listed.
  #
  # Each spec lives beside its consumer (`core.{name}_playbook.queries.<id>`),
  # never in a central registry, and rides the core -> global -> project merge like
  # any other config value. Inline arguments (`--where`, `| query(where={...})`)
  # deep-merge over a resolved spec for that call only.
  plans:
    # A plan is a directory claimed by its `index.md`. The shape is data rather
    # than hidden engine logic: a vault with a different one edits this one key,
    # and the engine still honours list order for a vault declaring several.
    glob:
      - plans/*/index.md
    # A milestone is a directory inside its plan's `milestones/`, seeded by
    # `core.groom_playbook.milestone_scaffold`, holding the milestone file plus any
    # sidecars written during the sprint. The milestone file is named after its own
    # directory, so a bare wikilink to the directory name resolves to it and `glob`
    # never claims a sidecar. Shared by groom (writes them, renders index.md's
    # table) and develop (groups them, delegates their paths): `glob` is relative to
    # the plan directory, `table_columns` is the projection index.md's
    # `## Milestones` table is rendered with.
    milestones:
      glob: milestones/*/M*.md
      table_columns: [id, title, sp, status]

  # `booping status` — the computed project status, read by the CLI and the
  # project-manager alike. Only query specs: the plans section's retro queue is
  # `core.retro_playbook.queries.candidates`, read in place.
  status:
    queries:
      # Plans in a status the groom or develop `run` machine declares non-terminal.
      # The status filter is built per call from those machines, never stated here.
      active_plans:
        sort: created
        columns: [status, sp, title]
      # Done plans no code review has closed on yet.
      unreviewed_plans:
        where:
          status: done
          code_reviews: []
        sort: "-created"
        columns: [sp, title, completed]

  # `booping run groom|develop` — the launch shape of a recorded headless run, read
  # by the CLI and the project-manager alike. No value here is env-interpolated.
  run:
    # Vault-relative directory of run records (`{id}.md`) and their gitignored logs.
    dir: runs
    # The child's argv; `--session-id {uuid}` and the prompt are appended per run.
    command: [claude, -p, --permission-mode, auto, --output-format, stream-json, --verbose]
    # Merged over the inherited environment. `0` keeps `-p` from ending background
    # tasks — the run's own workers — after 600 s.
    env:
      CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "0"
    # `{target}`: the plan's absolute `index.md`, or `{id} ({absolute item path})`
    # per item joined by `, `.
    prompt: "/booping:playbook {playbook} {target}"
    # Appended after a blank line under `--autonomous`.
    preamble: "AUTONOMOUS RUN, started by booping run — nobody can answer. Do not use AskUserQuestion and do not wait at review gates: confirm each yourself and log it with booping defaults add. Settle an unclear point with a sensible default and log it the same way. A question only the owner can answer parks the run where the playbook allows it; otherwise stop and report it. Never end the run while a background agent or a check you started is still running — wait for it. Never push."

  # `booping budget read|gate` — the subscription usage gate. Directly under `core`
  # because the run launcher, develop and the project-manager all pass it. Gated only
  # inside a registered run (`BOOPING_RUN_ID`, set by `booping run` on its child) or
  # under `core.autonomy: autonomous`.
  budget:
    # Seconds a run log stays a usable reading source: the newest `{core.run.dir}/*.log`
    # younger than this supplies the reading, else `probe` runs.
    max_age_s: 600
    # Argv run in the repo when no fresh log holds a reading; its stdout is parsed for
    # the last `rate_limit_event` stream line, stderr discarded.
    probe: [claude, -p, "Reply with the single word OK.", --model, haiku, --max-turns, "1", --no-session-persistence, --output-format, stream-json, --verbose]
    # 5-hour and 7-day usage percent at or over which the gate pauses.
    ceiling_5h_pct: 90
    ceiling_7d_pct: 85
    # 7-day percent points one registered run may spend, measured from the reading its
    # launch passed (stored as `usage_baseline_7d` on the run record); null = off.
    run_pct: null
    # `{start: "HH:MM", end: "HH:MM"}`, local time, an end before the start wrapping
    # midnight; outside it the gate pauses until the next start. null = always open.
    window: null

  sprint:
    default_threshold_sp: 35
    redecompose_threshold: 5
    # SP budget of one develop briefing: milestones pack greedily as a contiguous
    # run in `id` order while the group's summed `sp` stays at or under it. A lone milestone is
    # always a valid group and never split, even over the cap. Groom gates
    # milestones on `redecompose_threshold` too.
    max_sp: 15
    scale:
      - { sp: 1, meaning: "Simple text/config change, no risk" }
      - { sp: 2, meaning: "Simple task, predictable, no risk" }
      - { sp: 3, meaning: "Medium task, minor risks but predictable overall" }
      - { sp: 4, meaning: "Complex task, medium risk, may need small research but clear enough" }
      - { sp: 5, meaning: "Research task — developer needs to clarify and decompose further before proceeding" }

  # Task-type taxonomy every request is classified against — exactly one per plan.
  task_types:
    - type: feature
      description: "New user-facing capability. Needs business goal, design, milestones, DoD."
      doc_uri: ${CLAUDE_PLUGIN_ROOT}/docs/task_feature.md
    - type: bug
      description: "Defect — observed behavior diverges from expected. Needs triage, reproduction, root-cause hypothesis, minimal fix, and a regression test."
      doc_uri: ${CLAUDE_PLUGIN_ROOT}/docs/task_bug.md
    - type: refactoring
      description: "Internal structure change with no user-visible behavior change. Needs current-vs-target design, migration steps, and a no-behavior-change DoD."
      doc_uri: ${CLAUDE_PLUGIN_ROOT}/docs/task_refactoring.md

  # Task-tracker surface. Directly under `core` rather than in a playbook
  # namespace because several playbooks mirror their run outward through it.
  # `bin/booping-tracker` resolves this block by shelling to
  # `booping config-get core.tracker`, so the three-tier merge stays single-sourced.
  tracker:
    # Provider the tracker CLI dispatches to. `cli` ships alone: receipts-only
    # no-ops, every interactive run behaves exactly as it does today. Overridable
    # per invocation with `--driver`. An unknown name is a hard error rather than
    # a silent degrade to no-op, because the config merge has no schema gate.
    # A real provider's settings live in a block named after it; its
    # `api_key_env` names the environment variable carrying the API key — a
    # variable *name*, never a token: no config value anywhere is
    # env-interpolated, and secrets stay out of every config tier.
    driver: cli

  # Specs surface — typed records (values, rules, ADRs, …) read by `booping specs`
  # and by rule injection. Directly under `core` because several consumers share it.
  # A tier `path` that is absolute or `~`-prefixed is taken as is.
  specs:
    # Plugin-root-relative; holds README.md and schemas/{type}.yaml (types = schema stems).
    format: src/specs
    tiers:
      # Plugin-root-relative: booping's own shipped records.
      core: {namespace: booping, path: specs}
      # home_dir-relative; namespace null → the `USER` environment variable, read by code.
      global: {namespace: null, path: _specs}
      # Repo-relative; path null → the vault root itself (type directories beside plans/).
      project: {path: null}
    site:
      # Extra roots `booping specs site` renders after the tiers, each `{name, path}`;
      # path home_dir-relative like tiers.global. Set in the global tier.
      roots: []
      # Language of every site page: `<html lang>` and the label table below. A lang
      # with no table renders with `en` labels, keeps `<html lang>` and warns once.
      lang: en
      # UI strings, type/status/fact/author names and month names per language.
      # Lookup falls back key by key: `labels.{lang}` → `labels.en` → the raw id, so a
      # tier adds a locale or names its own type (`labels.ru.types.mechanic`) without
      # restating the rest. `ui` values may hold `{name}` fields; a list value is
