# Vault-home base for per-project vaults (`<home_dir>/<project>/`). Raw string;
# `~` is expanded at vault-resolution time. Override globally at
# ${XDG_CONFIG_HOME:-~/.config}/booping/config.yaml. A `.booping` `vault_path:`
# marker still wins over this. Set in the project tier it has no effect (the vault
# is already resolved by then). Top-level because it resolves the vault before any
# namespace is reachable.
home_dir: ~/Claude/

# Everything the shipped playbook set owns. Placement rule: a key one playbook
# owns lives at `core.{name}_playbook`; a key the development loop or several
# playbooks share sits directly under `core`. A user's own playbook namespace
# copies this shape.
core:
  # Agent an assisted playbook step delegates its heavy reads to.
  research_agent: "booping:booping-researcher"

  # Shell-outs a template body may call by dotted path: `{{ macro('core.macros.date', '+%H:%M') }}`.
  # Each value is an argv list (never a shell string) run with shell=False, and the list is a
  # prefix — call-site positional arguments append to it. stdout is stripped and cached per
  # argv tuple for the process, so a macro must be idempotent within one render and two
  # argument variants are two runs. `--stub-macro <path>[ <args>]=<literal>` on `render`,
  # `render-playbook` and `scaffold` returns the literal without executing.
  macros:
    date: ["date"]

  # A **query spec** is any mapping in the merged config, addressed by its dotted
  # path — `booping query --config <dotted.path>` and `{{ '<dotted.path>' | query }}`.
  # Keys, all optional:
  #
  #   glob:    ordered list of vault-relative glob patterns. The first pattern to
  #            claim a slug wins, so precedence is list order. A slug is the parent
  #            directory name when the pattern's last segment is a literal filename
  #            (`plans/*/index.md` -> `alpha`), else the file stem. Omitted -> the
  #            `core.plans.glob` default below.
  #   root:    which directory the globs resolve against. Omitted -> the vault;
  #            `core` -> the plugin root, for content the plugin itself ships
  #            (`core.migrate_playbook.queries.pending` below), which makes the
  #            spec resolvable outside any project.
  #   where:   mapping of clause -> value. The clause key carries its operator as a
  #            suffix: `k` equality, `k!` inequality, `k:in` membership in a list,
  #            `k:gt` / `k:lt` numeric ordering (both operands must coerce to a
  #            number; one that does not fails the clause). A row missing the field
  #            fails every operator.
  #   sort:    frontmatter field name, `-` prefixed for descending. Rows without a
  #            value come last. Omitted -> slug order.
  #   columns: projection, declared order preserved. `path` and `slug` are always
  #            present. Sorting happens before projection, so a sort field need not
  #            be listed.
  #
  # Each spec lives beside its consumer (`core.{name}_playbook.queries.<id>`),
  # never in a central registry, and rides the core -> global -> project merge like
  # any other config value. Inline arguments (`--where`, `| query(where={...})`)
  # deep-merge over a resolved spec for that call only.
  plans:
    # A plan is a directory claimed by its `index.md`. The shape is data rather
    # than hidden engine logic: a vault with a different one edits this one key,
    # and the engine still honours list order for a vault declaring several.
    glob:
      - plans/*/index.md

  sprint:
    default_threshold_sp: 35
    redecompose_threshold: 5
    max_milestones_per_agent: 2
    scale:
      - { sp: 1, meaning: "Simple text/config change, no risk" }
      - { sp: 2, meaning: "Simple task, predictable, no risk" }
      - { sp: 3, meaning: "Medium task, minor risks but predictable overall" }
      - { sp: 4, meaning: "Complex task, medium risk, may need small research but clear enough" }
      - { sp: 5, meaning: "Research task — developer needs to clarify and decompose further before proceeding" }

  # Task-type taxonomy every request is classified against — exactly one per plan.
  task_types:
    - type: feature
      description: "New user-facing capability. Needs business goal, design, milestones, DoD."
      doc_uri: ${CLAUDE_PLUGIN_ROOT}/docs/task_feature.md
    - type: bug
      description: "Defect — observed behavior diverges from expected. Needs triage, reproduction, root-cause hypothesis, minimal fix, and a regression test."
      doc_uri: ${CLAUDE_PLUGIN_ROOT}/docs/task_bug.md
    - type: refactoring
      description: "Internal structure change with no user-visible behavior change. Needs current-vs-target design, migration steps, and a no-behavior-change DoD."
      doc_uri: ${CLAUDE_PLUGIN_ROOT}/docs/task_refactoring.md

  groom_playbook:
    # Agent that performs the detached second-model review of a drafted plan.
    # Null → the reviewing step is skipped entirely.
    cross_review_agent: null
    agents:
      booping-researcher:
        internal: true
        good_for:
          - "Wide read or web search where results must be aggregated outside this skill's context and returned as a summary"
          - "Map blast radius across many files (which modules and integrations a change touches)"
          - "Extract patterns from a corpus too large to read directly (e.g. 'common shapes across 30 test files')"
          - "Verify package versions, image tags, API endpoints, CLI flags against current docs when many sources need to be checked"
          - "Cross-system architecture investigation across multiple repos or services"
          - "Compare framework/library options with deep tradeoff analysis"
        bad_for:
          - "Small checks — single-file reads, one-off greps, existence checks"
          - "When the information cannot be meaningfully compressed without losing signal the caller needs to decide"
          - "When the skill already needs to read the same few files for other reasons"
          - "When the question fits in a few lines of `ls`/`grep` output"
    queries:
      # The `intake` step's context table: everything past specification, newest
      # first. Stated as the statuses it keeps, because the operator vocabulary
      # is `=`, `!=` and `in` only.
      latest_plans:
        where:
          status:in:
            - ready-for-dev
            - in-progress
            - awaiting-retro
            - awaiting-learning
            - done
            - fail
            - cancelled
        sort: "-created"
        columns: [status, title, summary]

  develop_playbook:
    git:
      commit_message: '<agent>: <plan title> <message>'
      branches:
        - branch: feat/
          when:
            - feature
        - branch: fix/
          when:
            - bug
        - branch: refactor/
          when:
            - refactoring
        - branch: chore/
          when:
            - other
            - tooling, dependency bumps, formatting
    agents:
      booping-developer:
        internal: true
        good_for:
          - "All coding tasks — always delegate; never edit application code from the orchestrator"
      booping-researcher:
        internal: true
        good_for:
          - "Phase 0 drift spot-check: given a large set of plan-named files, determine whether actual file shape matches the plan's assumptions"
        bad_for:
          - "Milestone-diff review — that stays in the skill"
          - "Single-file reads — call Read directly"

  retro_playbook:
    status: awaiting-retro
    queries:
      # The playbook's "Plans awaiting retro" table.
      candidates:
        where:
          status: awaiting-retro
        sort: "-created"
        columns: [status, sp, title, created, completed]
    agents:
      booping-researcher:
        internal: true
        good_for:
          - "Phase 0 session-log search: scan ~/.claude/projects/ across all session logs for the plan's time window and aggregate into a structured summary of user questions, blockers, and detours"
        bad_for:
          - "Single-file reads — call Read directly"
          - "Phase 2 sprint analysis — stays in the orchestrator"
          - "Phase 4 lesson cross-check — stays in the orchestrator using the in-context lesson set"

  learn_playbook:
    status: awaiting-learning
    queries:
      # The playbook's "Plans awaiting learning" table.
      candidates:
        where:
          status: awaiting-learning
        sort: "-created"
        columns: [status, sp, title, created, completed, retro]

  code_review_playbook:
    status: awaiting-retro
    queries:
      # The `/code-review` skill's argument-free plan picker. Kept in step with
      # `core.code_review_playbook.status`.
      review_candidates:
        where:
          status: awaiting-retro
        columns: [sp, title]
      # The `code-review` playbook's `scope` step, which also needs the diff base.
      scope_candidates:
        where:
          status: awaiting-retro
        columns: [sp, title, commit]
    agents:
      booping-researcher:
        internal: true
        good_for:
          - "Blast-radius reads on large diffs (≥ ~5 files) aggregated into a compressed summary of touched modules and integration points"
        bad_for:
          - "Single-file reads — call Read directly"
          - "Small greps or existence checks that fit in a few lines of output"
      booping-developer:
        internal: true
        good_for:
          - "Applying user-approved non-trivial fixes surfaced by the review (BLOCKER or SUGGESTION)"
        bad_for:
          - "Trivial inline nits — orchestrator handles those directly"

  migrate_playbook:
    queries:
      # Every migration the plugin ships, in id order. The `migrate` playbook
      # narrows it to the pending set with `where={'id:gt': booping.latest_migration}`
      # — the marker's watermark, `-1` when nothing has been applied. `root: core`
      # because migrations ship with the plugin, not with the vault they transform.
      pending:
        root: core
        glob:
          - migrations/*/migration.md
        sort: id

  setup_playbook:
    # Scaffold tree materialised by
    # `booping scaffold core.setup_playbook.scaffold <vault-dir>`. The vault is a
    # git repo (see the vault-commit hook), so .gitignore applies to a home-dir
    # vault and a repo-local one alike.
    scaffold:
      plans:
        type: dir
      retrospectives:
        type: dir
      _lessons:
        type: dir
      _booping:
        type: dir
      notes:
        type: dir
      # Obsidian Bases fence (core plugin, no install needed) — a live view over
      # plans/, seeded once and never rewritten. Every path in a Bases filter is
      # resolved against the *Obsidian* vault root, which is not the booping vault
      # whenever the latter is nested: `this.file.folder` (the folder of the note
      # embedding the fence — this sprints.md) is what scopes the view to this
      # booping vault at any depth.
      sprints.md: |
        ```base
        formulas:
          plan: file.asLink(title)
        properties:
          formula.plan:
            displayName: Title
        filters:
          and:
            - file.inFolder(this.file.folder + "/plans")
            - file.name == "index"
        views:
          - type: table
            name: Plans
            order:
              - status
              - sp
              - formula.plan
              - summary
              - created
              - completed
            sort:
              - property: created
                direction: DESC
        ```
      .gitignore: |
        _booping/*.log

  playbook_authoring_playbook:
    # Scaffold tree materialised by
    # `booping scaffold core.playbook_authoring_playbook.scaffold <dir> --set name=<name>`:
    # a string is a file's content (Jinja-rendered), a mapping without `type` is a
    # directory's children.
    scaffold:
      playbook.md: |
        ---
        name: {{ name }}
        title: {{ name }}
        summary: One sentence naming what this playbook produces.
        trigger: the situation a user reaches for this playbook in
        ---

        # {{ name }}

        Preamble — what the driver needs before the first step: artifact model, hard
        rules, where the work lands. No step calls here.
      playbook.yaml: |
        # Step name -> its dependency step names. Each step is a sibling directory
        # holding a prompt.md.
        graph: {}
      _references:
        type: dir

plan:
  statuses:
    backlog:
      desc: "Parked plan — not actively being worked on. Sibling stubs from split sprints and user-filed ideas not yet in grooming live here."
      owner: groom
      terminal: false
      artifacts:
        - "Plan stub at ~/Claude/{project}/plans/{YYYYMMDD}-{kebab-title}.md (split siblings or parked ideas)"
      transitions:
        - to: in-spec
          skill: groom
          when: "User asks /groom to shape a parked plan, or /groom is invoked on a fresh request"

    in-spec:
      desc: "/groom is actively specifying — researching, designing, drafting the plan."
      owner: groom
      terminal: false
      artifacts:
        - "Plan at ~/Claude/{project}/plans/{YYYYMMDD}-{kebab-title}.md with all milestones, SP estimates, and DoDs"
        - "Sibling stub plans (one per split sprint) under the same plans/ path"
      transitions:
        - to: awaiting-plan-review
          skill: groom
          when: "Draft is complete and ready to present to the user"
          gates:
            - "Cross-validation run (see [cross-validation](${CLAUDE_PLUGIN_ROOT}/docs/cross_validation.md)) — single-file-bug skip acceptable"
            - "Every task estimated; any task ≥ redecompose_threshold SP has been re-decomposed"
          hooks:
            - frontmatter-update planned=@now
            - frontmatter-update commit=@head
        - to: backlog
          skill: groom
          when: "User parks the work mid-grooming to revisit later"

    awaiting-plan-review:
      desc: "Plan drafted; /groom is presenting to the user and awaiting explicit approval, change request, or cancellation."
      owner: groom
      terminal: false
      transitions:
        - to: ready-for-dev
          skill: groom
          when: "User explicitly approves the plan ('looks good', 'ship it'). Silence does not count."
          gates:
            - "Explicit user approval captured"
        - to: in-spec
          skill: groom
          when: "User requests changes that require re-research or re-design"

    ready-for-dev:
      desc: "Approved by user. Queued for /develop to claim."
      owner: develop
      terminal: false
      transitions:
        - to: in-progress
          skill: develop
          when: "/develop claims the plan at the start of its execute phase"

    in-progress:
      desc: "/develop has claimed the plan and is executing milestones."
      owner: develop
      terminal: false
      artifacts:
        - "Code changes per milestone on the sprint branch"
        - "DoD checkboxes flipped to [x] as tasks complete"
      transitions:
        - to: awaiting-retro
          skill: develop
          when: "All milestones done"
          gates:
            - "Every DoD checkbox marked [x]"
            - "Final Verification green"
          hooks:
            - suggest /playbook retro

    awaiting-retro:
      desc: "All milestones done; waiting for /retro to write the retrospective."
      owner: retro
      terminal: false
      transitions:
        - to: awaiting-learning
          skill: retro
          when: "Retrospective written and saved"
          gates:
            - "Retrospective markdown saved to retrospectives/"
            - "Self-review checklist passed"
          hooks:
            - frontmatter-update retro=retrospectives/YYYYMMDD-{kebab-title}.md
            - frontmatter-update goal=success|partial|fail

    awaiting-learning:
      desc: "Retro written; waiting for /learn to absorb lessons."
      owner: learn
      terminal: false
      transitions:
        - to: done
          skill: learn
          when: "All accepted learnings written"
          gates:
            - "User confirmed the review table"
            - "Every accepted lesson written to its target file"

    done:
      desc: "Terminal success. /learn has absorbed all lessons."
      terminal: true

    fail:
      desc: "Terminal technical failure. /develop hit an unrecoverable blocker."
      terminal: true

    cancelled:
      desc: "Terminal product decision. User shelved the plan."
      terminal: true

  superstates:
    specification:
      states:
        - backlog
        - in-spec
      transitions:
        - to: cancelled
          skill: groom
          when: "User shelves the request"
      on_exit: []
      on_entry: []
    planned:
      states:
        - awaiting-plan-review
        - ready-for-dev
      transitions:
        - to: cancelled
          skill: groom
          when: "User shelves the plan"
      on_exit: []
      on_entry: []
    executing:
      states:
        - in-progress
      transitions:
        - to: fail
          skill: develop
          when: "Unrecoverable blocker on the same milestone"
          gates:
            - "Two fix attempts documented in the plan"
            - "User has approved the abort"
      on_exit: []
      on_entry:
        - frontmatter-update started=@now
        - frontmatter-update commit=@head
    review:
      states:
        - awaiting-retro
        - awaiting-learning
      transitions:
        - to: done
          skill: retro
          when: "User skips remaining review steps and marks the plan done"
          hooks:
            - frontmatter-update goal=skipped
      on_exit: []
      on_entry:
        - frontmatter-update completed=@now
    terminal:
      states:
        - done
        - fail
        - cancelled
      transitions: []
      on_exit: []
      on_entry:
        - frontmatter-update completed=@now

  hooks:
    post:
      - vault-commit
