    # Open items: one file per user request or specs-to-code gap,
    # `{vault}/{dir}/OI-NNNN.md`, moved through the `open_item` machine of
    # `playbooks/specs/playbook.yaml` by `booping items` only. Shared by that CLI,
    # the specs playbook and the develop/groom hooks, so it sits under `core.specs`.
    open_items:
      # Vault-relative directory holding the item files; created on first write.
      dir: open-items
      # Scaffold tree materialised once per item by
      # `booping scaffold core.specs.open_items.scaffold {vault}/{dir} --set id=OI-NNNN
      #  --set title=<t> --set direction=<d|null> --set record=<ref|null> --set source=<s>
      #  --set created_at=<YYYY-MM-DD> [--set body=<text>]`.
      # Sole definition of the item file. `status: open` is the machine's `initial`;
      # `size`, `plan`, `closed_at` and `reason` start null and are written by the CLI and
      # the machine's hooks. `title` goes through `tojson` like the plan scaffold's.
      # `direction` is null for request and backlog items. `body` is the item text,
      # written verbatim (a variable's value is never re-parsed as Jinja), ending in
      # exactly the newlines it brought, or one when it brought none.
      scaffold:
        "{{ id }}.md": |
          ---
          id: {{ id }}
          title: {{ title | tojson }}
          status: open
          direction: {% if direction and direction != 'null' %}{{ direction }}{% else %}null{% endif %}
          record: {% if record and record != 'null' %}{{ record | tojson }}{% else %}null{% endif %}
          source: {{ source }}
          size: null
          plan: null
          created_at: {{ created_at }}
          closed_at: null
          reason: null
          ---

          # {{ title }}
          {% if body %}
          {{ body }}{% if not body.endswith('\n') %}{{ '\n' }}{% endif %}{% endif -%}
      # The index `booping items list` renders. The glob mirrors `dir`;
      # the status filter is applied per call from the machine, never stated here.
      index:
        glob: [open-items/OI-*.md]
        sort: id
        columns: [id, status, source, size, direction, record, title, plan]

  groom_playbook:
    # Agent that performs the detached second-model review of a drafted plan.
    # Null → the reviewing step is skipped entirely.
    cross_review_agent: null
    # Scaffold tree materialised by
    # `booping scaffold core.groom_playbook.scaffold {vault}/plans/<slug> --set title=<title> --set type=<type>`.
    # Sole definition of a plan's identity frontmatter. The `--set` variables go
    # through `tojson` because seed content is raw text with no YAML emitter behind
    # it, so a colon, a quote or an omitted value would otherwise break the document.
    scaffold:
      index.md: |
        ---
        title: {{ title | tojson }}
        type: {{ (type | default('')) | tojson }}
        status: framing
        sp: null
        related_to: null
        created: {{ macro('core.macros.date', '+%Y-%m-%d %H:%M') }}
        planned: null
        started: null
        completed: null
        code_reviews: []
        sessions: []
        retro: null
        summary: null
        commit: {{ macro('core.macros.git_commit') }}
        tracker_provider: null
        tracker_request: null
        tracker_issue: null
        return_to: null
        ---

        # {{ title }}
      request.md: ""
      # Sidecar the run parks its open questions in on `awaiting-clarification`;
      # seeded empty so the file is postable to the tracker verbatim from the
      # first question on. Format: ${CLAUDE_PLUGIN_ROOT}/docs/clarifications.md.
      clarifications.md: |
        # Clarifications
      milestones:
        type: dir
    # Scaffold tree materialised once per milestone by
    # `booping scaffold core.groom_playbook.milestone_scaffold {vault}/plans/<slug>/milestones
    #  --set id=<nn> --set slug=<kebab> --set title=<title> --set sp=<sp> --set plan=<plan-path>`.
    # Sole definition of the milestone file's identity frontmatter and required
    # headings; everything below them is the plan template's business.
    # `id` is quoted like the rest: bare zero-padded ids are read back as octal
    # ints (`01` -> 1) except where a digit forbids it (`08` stays a string),
    # which mixes types in one column and scrambles `--sort id`.
    milestone_scaffold:
      "M{{ id }}-{{ slug }}":
        "M{{ id }}-{{ slug }}.md": |
          ---
          id: {{ id | tojson }}
          title: {{ title | tojson }}
          sp: {{ sp }}
          status: pending
          plan: {{ (plan | default('')) | tojson }}
          ---

          # M{{ id }}: {{ title }}

          ## Tasks

          ## Definition of Done

          ## References

          ## Verify
    agents:
      booping-researcher:
        internal: true
        good_for:
          - "Wide read or web search where results must be aggregated outside this skill's context and returned as a summary"
          - "Map blast radius across many files (which modules and integrations a change touches)"
          - "Extract patterns from a corpus too large to read directly (e.g. 'common shapes across 30 test files')"
          - "Verify package versions, image tags, API endpoints, CLI flags against current docs when many sources need to be checked"
          - "Cross-system architecture investigation across multiple repos or services"
          - "Compare framework/library options with deep tradeoff analysis"
        bad_for:
          - "Small checks — single-file reads, one-off greps, existence checks"
          - "When the information cannot be meaningfully compressed without losing signal the caller needs to decide"
          - "When the skill already needs to read the same few files for other reasons"
          - "When the question fits in a few lines of `ls`/`grep` output"
    queries:
      # The `intake` step's context table: everything past specification, newest
      # first. Stated as the statuses it keeps, because the operator vocabulary
      # is `=`, `!=` and `in` only.
      latest_plans:
        where:
          status:in:
            - ready-for-dev
            - in-progress
            - awaiting-retro
            - awaiting-learning
            - done
            - fail
            - cancelled
        sort: "-created"
        columns:
          - status
          - title
          - summary
          - metrics_active_minutes
          - metrics_models
          - metrics_tokens_input
          - metrics_tokens_output
          - metrics_tokens_cache_creation
          - metrics_tokens_cache_read

  develop_playbook:
    # Agent a fix briefing is routed to when the milestone's own builder is not this
    # agent — an externally built milestone still gets its fixes done in-house.
    fallback_agent: "booping:booping-developer"
    git:
      commit_message: '<agent>: <plan title> <message>'
      branches:
        - branch: feat/
          when:
            - feature
        - branch: fix/
          when:
            - bug
        - branch: refactor/
          when:
            - refactoring
        - branch: chore/
          when:
            - anything not matching a task type
            - tooling, dependency bumps, formatting
    agents:
      booping-developer:
        internal: true
        good_for:
          - "All coding tasks — always delegate; never edit application code from the orchestrator"
      booping-researcher:
        internal: true
        good_for:
          - "Phase 0 drift spot-check: given a large set of plan-named files, determine whether actual file shape matches the plan's assumptions"
        bad_for:
          - "Milestone-diff review — that stays in the skill"
          - "Single-file reads — call Read directly"

  retro_playbook:
    status: done
    queries:
      # The playbook's "Plans awaiting retro" table.
      candidates:
        where:
          status: done
          retro: null
        sort: "-created"
        columns: [status, sp, title, created, completed]
    agents:
      booping-researcher:
        internal: true
        good_for:
          - "Phase 0 session-log search: scan ~/.claude/projects/ across all session logs for the plan's time window and aggregate into a structured summary of user questions, blockers, and detours"
        bad_for:
          - "Single-file reads — call Read directly"
          - "Phase 2 sprint analysis — stays in the orchestrator"
          - "Phase 4 lesson cross-check — stays in the orchestrator using the in-context lesson set"

  learn_playbook:
    queries:
      # The playbook's "Retrospectives awaiting learning" table. Learn's unit of
      # work is the standalone retrospective, never a plan directory.
      candidates:
        glob: [retrospectives/*.md]
        where:
          status: awaiting-learning
        sort: "-created"
        columns: [status, title, created, plan]

  code_review_playbook:
    queries:
      # The `code-review` playbook's `scope` step. Every done plan is a candidate —
      # `code_reviews` carries the plan's review history, so a reviewed plan stays
      # listed and can be reviewed again.
      scope_candidates:
        where:
          status: done
        columns: [sp, title, code_reviews, commit]
    agents:
      booping-researcher:
        internal: true
        good_for:
          - "Blast-radius reads on large diffs (≥ ~5 files) aggregated into a compressed summary of touched modules and integration points"
        bad_for:
          - "Single-file reads — call Read directly"
          - "Small greps or existence checks that fit in a few lines of output"
      booping-developer:
        internal: true
        good_for:
          - "Applying user-approved non-trivial fixes surfaced by the review (BLOCKER or SUGGESTION)"
        bad_for:
          - "Trivial inline nits — orchestrator handles those directly"

  project_manager_playbook:
    # Workers the manager delegates to; the vault, every commit and every transition
    # stay with the driver.
    agents:
      booping-developer:
        internal: true
        good_for:
          - "Tiny fixes filed as items and fixes from the independent code review — every repo code edit; the manager never edits code itself"
        bad_for:
          - "Planned work — that goes through groom and `booping run develop`"
      booping-researcher:
        internal: true
        good_for:
          - "Classifying an item that needs a wide read of the repo before it is a tiny fix or a plan"
        bad_for:
          - "Single-file reads — call Read directly"
    # Item sizes and the batches `booping items batch` packs. `sizes` maps each
    # size `booping items size` accepts to its story points; `direct` lists the
    # sizes that skip grooming and go to a worker in a batch; `max_sp` caps one
    # batch's summed points. Open items of a direct size that wait on no question
    # are packed greedily in id order. An unsized item takes the plan route.
    batch:
      sizes: {XS: 1, S: 2, M: 5, L: 13}
      direct: [XS, S]
      max_sp: 8

  migrate_playbook:
    queries:
      # Every migration the plugin ships, in id order. The `migrate` playbook
      # narrows it to the pending set with `where={'id:gt': booping.latest_migration}`
      # — the marker's watermark, `-1` when nothing has been applied; `makemigration`
      # reads it whole for the next id. `root: core`
      # because migrations ship with the plugin, not with the vault they transform.
      pending:
        root: core
        glob:
          - migrations/*/migration.md
        sort: id

  setup_playbook:
    # Scaffold tree materialised by
    # `booping scaffold core.setup_playbook.scaffold <vault-dir>`. The vault is a
    # git repo (see the vault-commit hook), so .gitignore applies to a home-dir
    # vault and a repo-local one alike.
    scaffold:
      plans:
        type: dir
      retrospectives:
        type: dir
      codereviews:
        type: dir
      notes:
        type: dir
      # Obsidian Bases fence (core plugin, no install needed) — a live view over
      # plans/, seeded once and never rewritten. Every path in a Bases filter is
      # resolved against the *Obsidian* vault root, which is not the booping vault
      # whenever the latter is nested: `this.file.folder` (the folder of the note
      # embedding the fence — this sprints.md) is what scopes the view to this
      # booping vault at any depth.
      sprints.md: |
        ```base
        formulas:
          plan: file.asLink(title)
          tokens_in: ((metrics_tokens_input + metrics_tokens_cache_creation + metrics_tokens_cache_read) / 1000000).round(1) + "M"
          tokens_out: (metrics_tokens_output / 1000).round(0) + "k"
          cached: (metrics_tokens_cache_read / 1000000).round(1) + "M"
        properties:
          formula.plan:
            displayName: Title
          formula.tokens_in:
            displayName: In
          formula.tokens_out:
            displayName: Out
          formula.cached:
            displayName: Cached
          note.metrics_active_minutes:
            displayName: Active min
          note.metrics_models:
            displayName: Models
        filters:
          and:
            - file.inFolder(this.file.folder + "/plans")
            - file.name == "index"
        views:
          - type: table
            name: Plans
            order:
              - status
              - sp
              - formula.plan
              - summary
              - created
              - completed
              - metrics_active_minutes
              - metrics_models
              - formula.tokens_in
              - formula.tokens_out
              - formula.cached
            sort:
              - property: created
                direction: DESC
        ```
      .gitignore: |
        .booping.log

  playbook_authoring_playbook:
    # Scaffold tree materialised by
    # `booping scaffold core.playbook_authoring_playbook.scaffold <dir> --set name=<name>`:
    # a string is a file's content (Jinja-rendered), a mapping without `type` is a
    # directory's children.
    scaffold:
      playbook.md: |
        ---
        name: {{ name }}
        title: {{ name }}
        summary: One sentence naming what this playbook produces.
        trigger: the situation a user reaches for this playbook in
        ---

        # {{ name }}

        Preamble — what the driver needs before the first step: artifact model, hard
        rules, where the work lands. No step calls here.
      playbook.yaml: |
        # Step name -> its dependency step names. Each step is a sibling directory
        # holding a prompt.md.
        graph: {}
      _references:
        type: dir
