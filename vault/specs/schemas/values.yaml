# values: specs/values/<NNNN>-<slug>.md, one file per area: `## Values`, a `###`
# per value — a paragraph, then "In practice" and "Trade-off"; an optional
# `## Not valued` names what we deliberately do not optimise for.
doc: values

rules:
  - select: FRONTMATTER
    has:
      type: values
      title: '^.+$'
      summary: '^.{1,200}$'
      created_by: { enum: [owner, claude] }
      created_at: '^\d{4}-\d{2}-\d{2}$'
      updated_at: '^\d{4}-\d{2}-\d{2}$'

  - select: H2
    ordered: [Values, Not valued?]
    strict: true

  - select: SECTION("Values") > SECTION(/.+/)
    min: 1
    each:
      - select: SECTION > P
        min: 1
      - select: UL > LI
        count: 2
      - select: UL > LI[0]
        starts_with: '**In practice:**'
      - select: UL > LI[1]
        starts_with: '**Trade-off:**'

  - select: SECTION("Not valued") > SECTION(/.+/)
    optional: true
    min: 1
    each:
      - select: SECTION > P
        min: 1
