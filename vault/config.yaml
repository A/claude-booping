core:
  sprint:
    max_milestones_per_agent: 1

  develop_playbook:
    agents:
      pi-developer:
        good_for:
          - "All development tasks — milestone implementation from a develop briefing; use instead of booping-developer"
        bad_for:
          - "Vault writes — the runner owns the plan directory"
          - "Research or read-only investigation — that stays booping:booping-researcher"

  code_review_playbook:
    agents:
      plannotator-reviewer:
        good_for:
          - "Interactive browser review of a diff with AI findings pre-seeded; human confirms/dismisses inline and feedback returns to the harness"
        bad_for:
          - "Headless / CI runs, no display available, or a quick chat-only review"
