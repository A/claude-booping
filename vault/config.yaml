core:
  model_benchmark_playbook:
    # Second diff reviewer beside the generic `fable:medium` one; null → fable alone.
    review_agent: codex

  docs_playbook:
    queries:
      # The feature index, rendered into `research` and `targeting`.
      features:
        glob: [story/*.md]
        columns: [title, summary, status]
      # The value list, rendered into `briefing` and `research`.
      values:
        glob: [value/*.md]
        columns: [title, kind, summary]
