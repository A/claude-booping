[project]
name = "pytest-txtar"
version = "0.1.0"
description = "Txtar-driven contract testing for command-line tools: sandboxed runs, normalized assertions, golden update."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["pytest>=8"]

[project.entry-points.pytest11]
pytest_txtar = "pytest_txtar.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_txtar"]

[dependency-groups]
dev = [
    "ruff",
    "basedpyright",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
