skills:
  develop:
    disable_internal_agents: true
    agents:
      test-cli:
        type: cli
        # no-placeholder shape: the quoted prompt is appended as the last positional arg
        command: "printf %s"
      test-cli-with-placeholder:
        type: cli
        # placeholder lives OUTSIDE the inner sh-c string so shlex.quote'd prompt
        # round-trips as a single argv element (passed to sh as $1).
        command: 'sh -c "printf %s \"$1\"" -- {{ prompt }}'
      test-cli-fail:
        type: cli
        command: "sh -c 'exit 7'"
      test-no-type:
        good_for:
          - "an agent entry without explicit type — defaults to agent"
      pi-mesh:
        type: cli
        command: "pi --print"
        good_for:
          - "Concrete code change in a git-tracked project, expressible with testable acceptance"
        bad_for:
          - "Exploratory questions or dirty/non-git repos"
