# on_exit → hooks equivalence table
#
# Complete expected mutation set per edge: every frontmatter mutation
# resolve_hooks(from, to) emits — beyond the mechanical status=<to> set — is
# listed here exactly once. The lone non-frontmatter row is `suggest /retro`.
# TestEquivalence asserts both directions: every listed mutation is present in
# the new wiring, AND the wiring emits no frontmatter mutation that isn't listed
# here. Add a row whenever a new mutation is wired in, or the no-extras check
# fails.
#
# `old` records the pre-change on_exit-table mutation this row replaces, or
# "(none — superstate-hook addition)" for a mutation the superstate wiring adds
# that the old table never produced.
#
# Location types: edge_hooks, superstate_on_entry

entries:
  # backlog → cancelled
  - from: backlog
    to: cancelled
    old: "set `completed: yyyymmdd hh:mm`"
    new_location: superstate_on_entry
    new_target: terminal
    new_hook: "frontmatter-update completed=@now"

  # in-spec → awaiting-plan-review
  - from: in-spec
    to: awaiting-plan-review
    old: "set `planned: yyyymmdd hh:mm`"
    new_location: edge_hooks
    new_target: "in-spec → awaiting-plan-review"
    new_hook: "frontmatter-update planned=@now"

  - from: in-spec
    to: awaiting-plan-review
    old: "set `commit: <repo HEAD>` from `context.project.git_commit`"
    new_location: edge_hooks
    new_target: "in-spec → awaiting-plan-review"
    new_hook: "frontmatter-update commit=@head"

  # in-spec → cancelled
  - from: in-spec
    to: cancelled
    old: "set `completed: yyyymmdd hh:mm`"
    new_location: superstate_on_entry
    new_target: terminal
    new_hook: "frontmatter-update completed=@now"

  # awaiting-plan-review → cancelled
  - from: awaiting-plan-review
    to: cancelled
    old: "set `completed: yyyymmdd hh:mm`"
    new_location: superstate_on_entry
    new_target: terminal
    new_hook: "frontmatter-update completed=@now"

  # ready-for-dev → in-progress
  - from: ready-for-dev
    to: in-progress
    old: "set `started: yyyymmdd hh:mm`"
    new_location: superstate_on_entry
    new_target: executing
    new_hook: "frontmatter-update started=@now"

  - from: ready-for-dev
    to: in-progress
    old: "set `commit: <repo HEAD>` from `context.project.git_commit` (only after the user confirmed the plan is still valid, or the legacy fallback applied)"
    new_location: superstate_on_entry
    new_target: executing
    new_hook: "frontmatter-update commit=@head"

  # in-progress → awaiting-retro
  - from: in-progress
    to: awaiting-retro
    old: "set `completed: yyyymmdd hh:mm`"
    new_location: superstate_on_entry
    new_target: review
    new_hook: "frontmatter-update completed=@now"

  - from: in-progress
    to: awaiting-retro
    old: "suggest `/retro <plan-path>`"
    new_location: edge_hooks
    new_target: "in-progress → awaiting-retro"
    new_hook: "suggest /retro"

  # in-progress → fail
  - from: in-progress
    to: fail
    old: "set `completed: yyyymmdd hh:mm`"
    new_location: superstate_on_entry
    new_target: terminal
    new_hook: "frontmatter-update completed=@now"

  # awaiting-retro → awaiting-learning
  - from: awaiting-retro
    to: awaiting-learning
    old: "set `retro: retrospectives/YYYYMMDD-{kebab-title}.md`"
    new_location: edge_hooks
    new_target: "awaiting-retro → awaiting-learning"
    new_hook: "frontmatter-update retro=retrospectives/YYYYMMDD-{kebab-title}.md"

  - from: awaiting-retro
    to: awaiting-learning
    old: "set `goal: success | partial | fail`"
    new_location: edge_hooks
    new_target: "awaiting-retro → awaiting-learning"
    new_hook: "frontmatter-update goal=success|partial|fail"

  # awaiting-retro → done
  - from: awaiting-retro
    to: done
    old: "set `goal: skipped`"
    new_location: edge_hooks
    new_target: "awaiting-retro → done"
    new_hook: "frontmatter-update goal=skipped"

  # Deliberate superstate-hook addition: the old on_exit table set only
  # `goal: skipped` on the skip-retro edge and no `completed`. The terminal
  # superstate's on_entry now stamps `completed` on every edge into a terminal
  # state, so this skip-retro edge gains it too — an intentional improvement,
  # not an equivalence break.
  - from: awaiting-retro
    to: done
    old: "(none — superstate-hook addition)"
    new_location: superstate_on_entry
    new_target: terminal
    new_hook: "frontmatter-update completed=@now"

  # awaiting-learning → done
  - from: awaiting-learning
    to: done
    old: "set `completed: yyyymmdd hh:mm`"
    new_location: superstate_on_entry
    new_target: terminal
    new_hook: "frontmatter-update completed=@now"

  # Inherited "group" edge — the planned superstate's own → cancelled
  # transition, reachable from its ready-for-dev substate (awaiting-plan-review
  # also inherits it, covered by its own row above). It crosses a superstate
  # boundary, so the terminal on_entry hook fires. The old per-status on_exit
  # table did not enumerate inherited edges; listed here so the
  # complete-mutation-set check covers it.

  # ready-for-dev → cancelled (inherited planned → terminal)
  - from: ready-for-dev
    to: cancelled
    old: "(none — inherited planned edge)"
    new_location: superstate_on_entry
    new_target: terminal
    new_hook: "frontmatter-update completed=@now"