state: main
graph:
  intake: []
  step-pipeline:
    dependencies: [intake]
    state: step
    repeat: once per item the intake names
    graph:
      step-spec: []

states:
  main:
    artifact: index.md
    initial: intaking
    hooks:
      post: ["script post-note"]
    statuses:
      intaking:
        transitions:
          - to: researching
            when: intake step complete
            gates: ["request captured in the artifact"]
            hooks:
              - frontmatter-update researched="{{ macro('core.macros.date', '+%Y-%m-%d %H:%M') }}"
              - script check-findings
          - to: broken
            when: never — exercises a failing hook
            hooks: ["script fail-hook"]
          - to: weird
            when: never — exercises an unknown hook
            hooks: ["teleport somewhere"]
      researching:
        transitions:
          - to: done
            when: research complete
      broken: {terminal: true}
      weird: {terminal: true}
      done: {terminal: true}
  step:
    artifact: steps/{instance}/index.md
    initial: spec-ing
    statuses:
      spec-ing:
        transitions:
          - to: done
            when: spec written
            hooks: ["script check-findings"]
      done: {terminal: true}
