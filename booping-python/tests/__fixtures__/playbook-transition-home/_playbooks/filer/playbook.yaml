state: main
graph:
  spec: []
  spec-pipeline:
    dependencies: [spec]
    state: step
    repeat: once per item the spec names
    graph:
      spec-step: []

states:
  main:
    artifact: index.md
    initial: drafting
    statuses:
      drafting:
        transitions:
          - to: filed
            when: brief reviewed
            hooks:
              - frontmatter-update brief.md reviewed="{{ macro('core.macros.date', '+%Y-%m-%d') }}"
          - to: filed-missing
            when: never — exercises a file target that does not exist
            hooks:
              - frontmatter-update nope.md reviewed="{{ macro('core.macros.date', '+%Y-%m-%d') }}"
          - to: filed-raw
            when: never — exercises a file target without frontmatter
            hooks:
              - frontmatter-update raw.md reviewed="{{ macro('core.macros.date', '+%Y-%m-%d') }}"
          - to: filed-instance
            when: never — exercises {instance} with no instance in scope
            hooks: ["frontmatter-update steps/{instance}/notes.md seen=recorded"]
          - to: done
            when: never — exercises a no-target hook
            hooks:
              - frontmatter-update noted="{{ macro('core.macros.date', '+%Y-%m-%d') }}"
      filed: {terminal: true}
      filed-missing: {terminal: true}
      filed-raw: {terminal: true}
      filed-instance: {terminal: true}
      done: {terminal: true}
  step:
    artifact: steps/{instance}/index.md
    initial: spec-ing
    statuses:
      spec-ing:
        transitions:
          - to: filed
            when: instance notes reviewed
            hooks: ["frontmatter-update steps/{instance}/notes.md seen=recorded"]
      filed: {terminal: true}
