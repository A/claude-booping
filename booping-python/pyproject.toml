[project]
name = "booping"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jinja2",
    "pyyaml",
    "pydantic",
    "ruamel.yaml==0.19.1",
]

[project.scripts]
booping = "booping.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/booping"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-txtar",
    "ruff",
    "basedpyright",
]
docs = [
    "mkdocs",
]

# `just pytest` is the unit suite; the txtar corpus under e2e/ is `just e2e`'s job.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
pytest-txtar = { path = "../pytest-txtar", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.basedpyright]
include = ["src", "tests", "e2e"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
