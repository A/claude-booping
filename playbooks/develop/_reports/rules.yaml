doc: develop-report

rules:
  - select: SECTION("Available Agents") > TABLE
    id: develop.agents-table
    count: 1
    columns: [agent, good for, bad for]

  - select: DOCUMENT H2
    id: develop.sections
    ordered:
      - Available Agents
      - Shared instructions
      - Playbook Steps
      - State
      - "Step: Intake"
      - "Step: Provision"
      - "Step: Develop Loop"
      - "Step: Verify"
      - "Step: Wrap Up"
