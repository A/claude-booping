- description: verify-references regress — grounds are repo-internal on no-refs-plan
  vars:
    input: file://_fixtures/no-refs-plan.md
  metadata:
    playbook: groom
    step: verify-references
    fixture: no-refs-plan
    tier: regress
  assert:
    - type: llm-rubric
      value: "NOTHING-JUSTIFIED: the Verdict paragraph names the concrete grounds — every reference the plan makes is repo-internal (module paths like `booping-python/src/booping/render/playbook_sections.py`, the project's own `just test`/`just lint` targets) — instead of treating those repo-internal paths and commands as unverifiable externals. Fails if the rationale lists repo-internal items as rows or as unverifiable, or gives no grounds at all."

- description: verify-references smoke — literal-only pin fix on invalidating-correction
  vars:
    input: file://_fixtures/invalidating-correction.md
  metadata:
    playbook: groom
    step: verify-references
    fixture: invalidating-correction
    tier: smoke
  assert:
    # TRAP-EDIT-LITERAL-ONLY + TRAP-NO-REESTIMATE — every changed line swaps the stale
    # `openai==0.28.1` pin for one consistent replacement and nothing else in the file
    # (task wording, DoD, SP values, milestone structure, frontmatter) differs
    - type: javascript
      value: |
        const fail = (r) => ({ pass: false, score: 0, reason: r });
        const seed = (context && context.vars && context.vars.input) || '';
        const seedMatch = /<file path="plans\/20260801-summarize-support-tickets\.md">\n([\s\S]*?)\n<\/file>/.exec(seed);
        if (!seedMatch) return fail('fixture carries no seeded plan file');
        const writtenMatch = /<file path="plans\/20260801-summarize-support-tickets\.md">\n([\s\S]*?)\n<\/file>/.exec(output);
        if (!writtenMatch) return fail('plan file not in the written manifest — the stale `openai==0.28.1` pin needs a literal fix');
        const original = seedMatch[1];
        const written = writtenMatch[1];
        const origLines = original.split('\n');
        const newLines = written.split('\n');
        if (origLines.length !== newLines.length)
          return fail(`plan line count changed (${origLines.length} -> ${newLines.length}) — only the literal pin swap is allowed, nothing added or removed`);
        const changed = [];
        for (let i = 0; i < origLines.length; i++) if (origLines[i] !== newLines[i]) changed.push(i);
        if (!changed.length) return fail('plan is byte-identical — the stale `openai==0.28.1` pin was never corrected');
        let newPin = null;
        for (const i of changed) {
          const o = origLines[i], n = newLines[i];
          if (!o.includes('openai==0.28.1')) return fail(`line ${i + 1} changed but does not carry the stale pin: "${o}" -> "${n}"`);
          const m = /openai==([0-9][\w.]*)/.exec(n);
          if (!m) return fail(`line ${i + 1}: no replacement openai pin found in "${n}"`);
          if (newPin === null) newPin = m[1];
          else if (newPin !== m[1]) return fail(`inconsistent replacement pins: openai==${newPin} vs openai==${m[1]}`);
          if (o.split('openai==0.28.1').join(`openai==${newPin}`) !== n)
            return fail(`line ${i + 1} changed by more than the pin swap: "${o}" -> "${n}"`);
        }
        if ((written.match(/openai==0\.28\.1/g) || []).length) return fail('stale pin `openai==0.28.1` still present somewhere in the plan');
        return { pass: true, score: 1, reason: `plan edits exactly the pin (-> openai==${newPin}) at ${changed.length} line(s), nothing else` };

- description: verify-references regress — invalidation reported, not resolved, on invalidating-correction
  vars:
    input: file://_fixtures/invalidating-correction.md
  metadata:
    playbook: groom
    step: verify-references
    fixture: invalidating-correction
    tier: regress
  assert:
    - type: llm-rubric
      value: "TRAP-INVALIDATION-REPORTED: `## Notes:` states that the corrected `openai` release changes the API task 2.1's DoD depends on — `openai.ChatCompletion.create`, reading the reply off `response[\"choices\"][0][\"message\"][\"content\"]`, and catching `openai.error.RateLimitError` are all pre-1.0 SDK shapes a current release does not carry — and hands the call to the approval summary instead of resolving it in place. Fails if Notes says nothing about the DoD depending on the old API shape, or the invalidation is missing entirely."
    - type: llm-rubric
      value: "TRAP-NO-NEW-TASKS: no task, milestone or DoD line is added, split or reworded to accommodate the corrected `openai` version — M2's task 2.1/2.2 descriptions and DoD bullets read exactly as the fixture wrote them, the pin aside. Fails if any DoD bullet, task description or milestone is rewritten, added or removed to fix up the API mismatch."
