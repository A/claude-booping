# Shared structural contract, YAML-anchored and reused across fixtures:
# - &a_identity  — FRONTMATTER-KEYS + H1-MATCHES-TITLE: true of the plan file whatever the
#   template — title/type/created/split_from carried over from intake unchanged, the four
#   never-touched-here keys still null, `sp` an integer, `summary` one non-empty quoted line
#   capped at 120 chars, and the single H1 matching frontmatter `title`.
# - &a_milestones + &a_dod_parity + &a_sp — MILESTONE-SHAPE + SP-ARITHMETIC: draft-plan's own
#   milestone/task/DoD/SP contract (opus-5.md "Write the body" + "Size honestly"), true
#   whichever template's own section list wraps it — Milestones is a section every catalogue
#   template (and any new one authored on the spot) carries.
# - &a_cli_sections — TEMPLATE-SECTIONS: the `cli` Plan Body's own H2 skeleton. Specific to the
#   three fixtures that draft against `cli` (the catalogue obviously fits); no-template-fits
#   forces a freshly authored template instead and gets its own section rules.
# Arithmetic (task-row count vs DoD-block count, and the three-way SP sum) is mdcheck-unreachable
# across two selectors, so it rides as plain regex counting per docs/eval-checks.md.

- description: draft-plan smoke — cross-reviewed cli plan on designed-cross-reviewed
  vars:
    input: file://_fixtures/designed-cross-reviewed.md
  metadata:
    playbook: groom
    step: draft-plan
    fixture: designed-cross-reviewed
    tier: smoke
  assert:
    # PLAN-ONLY-UPDATED (file half) — the run's `plan.md` is the only file this step writes;
    # `index.md` gets nothing from draft-plan, the cross-review outcome travels in the return
    - &a_file
      type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        onTextMode: fail
        expect:
          - path: 'plans/20260801-sprints-report-script/plan\.md$'
            minLines: 40
        noOthers: true
    # FRONTMATTER-KEYS + H1-MATCHES-TITLE
    - &a_identity
      type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'plans/.+/plan\.md$'
        rules: |
          - select: FRONTMATTER
            has:
              title: "Sprints report as a playbook script"
              type: feature
              status: in-spec
              sp: '^\d+$'
              split_from: { enum: ["null"] }
              created: { enum: [2026-08-01] }
              planned: { enum: ["null"] }
              started: { enum: ["null"] }
              completed: { enum: ["null"] }
              retro: { enum: ["null"] }
              goal: { enum: ["null"] }
              summary: '^".{1,120}"$'
              commit: { enum: ["null"] }
          - select: H1
            count: 1
            match: '^Sprints report as a playbook script$'
    # TEMPLATE-SECTIONS — the cli Plan Body's own H2 order, Risk register optional
    - &a_cli_sections
      type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'plans/.+/plan\.md$'
        rules: |
          - select: H1 > H2
            ordered: [Context, Decisions, Architecture, Milestones, I/O contract, Final Verification, Out of scope, Risk register?, CLAUDE.md impact]
            strict: true
    # MILESTONE-SHAPE
    - &a_milestones
      type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'plans/.+/plan\.md$'
        rules: |
          - select: SECTION("Milestones") > H3
            min: 1
            match: '^M\d+: .+ — \d+ SP \| pending$'
          - select: SECTION("Milestones") > SECTION(/^M\d+:/)
            min: 1
            each:
              - select: P[text^="**Goal**"]
                count: 1
              - select: P[text^="**Verify**"]
                count: 1
              - select: TABLE
                count: 1
                columns: [Task, Description, Files, SP, Status]
                rows: { min: 1 }
              - select: H4
                min: 1
                match: '^Task \d+\.\d+ DoD$'
    # MILESTONE-SHAPE (arithmetic half) — one DoD block per task row; mdcheck can't count
    # across two selectors in one rule, so this is script arithmetic, not a rubric
    - &a_dod_parity
      type: javascript
      value: |
        const fileMatch = /<file path="[^"]*plans\/[^"]*\/plan\.md">\n([\s\S]*?)\n<\/file>/.exec(output);
        if (!fileMatch) return { pass: false, score: 0, reason: 'no plan file in output' };
        const body = fileMatch[1];
        const taskRows = (body.match(/^\|\s*\d+\.\d+\s*\|/gm) || []).length;
        const dodBlocks = (body.match(/^#### Task \d+\.\d+ DoD$/gm) || []).length;
        if (taskRows !== dodBlocks)
          return { pass: false, score: 0, reason: `${taskRows} task table row(s) but ${dodBlocks} DoD block(s)` };
        return { pass: true, score: 1, reason: `${taskRows} task rows == ${dodBlocks} DoD blocks` };
    # SP-ARITHMETIC
    - &a_sp
      type: javascript
      value: |
        const fileMatch = /<file path="[^"]*plans\/[^"]*\/plan\.md">\n([\s\S]*?)\n<\/file>/.exec(output);
        if (!fileMatch) return { pass: false, score: 0, reason: 'no plan file in output' };
        const body = fileMatch[1];
        const fmMatch = /^sp:\s*(\d+)\s*$/m.exec(body);
        if (!fmMatch) return { pass: false, score: 0, reason: 'frontmatter `sp` is missing or not an integer' };
        const sp = parseInt(fmMatch[1], 10);
        const milestoneSPs = [...body.matchAll(/^### M\d+:.*—\s*(\d+)\s*SP\s*\|\s*pending\s*$/gm)].map((m) => parseInt(m[1], 10));
        const milestoneTotal = milestoneSPs.reduce((a, b) => a + b, 0);
        const taskSPs = [...body.matchAll(/^\|\s*\d+\.\d+\s*\|[^|]*\|[^|]*\|\s*(\d+)\s*\|[^|]*\|\s*$/gm)].map((m) => parseInt(m[1], 10));
        const taskTotal = taskSPs.reduce((a, b) => a + b, 0);
        const outOfRange = taskSPs.filter((n) => n < 1 || n > 5);
        if (sp !== milestoneTotal || milestoneTotal !== taskTotal)
          return { pass: false, score: 0, reason: `frontmatter sp=${sp}, milestone total=${milestoneTotal}, task total=${taskTotal} — must all match` };
        if (outOfRange.length)
          return { pass: false, score: 0, reason: `task SP value(s) outside the 1-5 scale: ${outOfRange.join(', ')}` };
        return { pass: true, score: 1, reason: `sp=${sp} consistent — milestones ${milestoneSPs.join('+')}, tasks ${taskSPs.join('+')}` };
    # RISK-REGISTER-LINE — the RISK finding is deferred, exactly one register line
    - type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'plans/.+/plan\.md$'
        rules: |
          - select: SECTION("Risk register") > UL > LI
            count: 1
            require: '(?i)risk'
          - select: SECTION("Risk register") > UL > LI
            require: '(?i)defer'
    # RETURN-SHAPE — Changed: one [UPDATED] line naming the plan, template `cli`, SP total;
    # Notes: milestone/SP breakdown, checklist verdict, cross-review line — three entries
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        sections:
          - name: Changed
            entry: '^-\s+\[(UPDATED)\]\s+`?([^`\s]+)`?\s+—\s+template\s+`cli`,\s+\d+\s+SP$'
            matchManifest: true
            statuses: [UPDATED]
            minEntries: 1
            maxEntries: 1
          - name: Notes
            entry: '^-\s+\S.*$'
            fold: true
            minEntries: 3
            maxEntries: 3
        onlyListed: true

- description: draft-plan regress — decomposition and disposition fidelity on designed-cross-reviewed
  vars:
    input: file://_fixtures/designed-cross-reviewed.md
  metadata:
    playbook: groom
    step: draft-plan
    fixture: designed-cross-reviewed
    tier: regress
  assert:
    - type: llm-rubric
      value: "TEMPLATE-FIT: `cli` is the chosen entry — the dominant surface is a playbook-local script plus the retirement of a `bin/booping` subcommand — and the near misses (`backend`, `claude_skill`) are passed over on that surface, not on taste."
    - type: llm-rubric
      value: "FILES-FROM-BLAST-RADIUS: every Files cell names a path the blast-radius map carries; no invented path, no glob standing in for a file the map left unnamed."
    - type: llm-rubric
      value: "DESIGN-FAITHFUL: Decisions and Architecture restate the design's settled calls — placement of the script, hook wiring, vault resolution, the vault-commit call — adding no new architecture call and dropping none."
    - type: llm-rubric
      value: "MILESTONES-SELF-CONTAINED: with `max_milestones_per_agent: 1`, each milestone is executable in a fresh session from the plan alone — no \"as above\", no reliance on state an earlier milestone's agent held."
    - type: llm-rubric
      value: "DOD-AND-VERIFY-OBSERVABLE: every DoD checkbox names an observable outcome (invocation, output, exit code, asserted behaviour) and every `Verify` is a runnable invocation of the project's own tooling or a stated observable; no \"works correctly\", no prose verify, no TBD."
    - type: llm-rubric
      value: "HONEST-SIZING: the research-shaped chunk (vault resolution from `BOOPING_WORKDIR` on a repo-local vault) stands at its honest 5 SP as one task — not shaved to 4, not pre-split, and no note claims the re-decompose threshold was handled here."
    - type: llm-rubric
      value: "SUMMARY-OUTCOME: `summary` states the visible outcome (the vault's sprint report is produced by the groom playbook itself), not the engineering output (\"add a script, remove a hook\"), and matches the plan's scope."
    - type: llm-rubric
      value: "SCOPE-HELD: Out of scope mirrors the framing's exclusions — snapshot columns and sort order, historical re-render, `vault-commit` — and no milestone or task targets them."
    - type: llm-rubric
      value: "FINDINGS-DISPOSED: the CRITICAL lands as plan text (a task, a DoD item or a Final Verification line, covering the untested fail-open path); the RISK is folded in or sits in the risk register with its reason; the NOTE blocks nothing; the return's cross-review line matches what the plan shows."
    - type: llm-rubric
      value: "CHECKLIST-HONEST: the `cli` Quality Checklist holds on the artifact — I/O contract enumerates flags, stdout shape and an exit code per failure mode; the anti-pattern items are absent in fact — rather than being reported as satisfied."

- description: draft-plan smoke — no cross-review configured on no-cross-review
  vars:
    input: file://_fixtures/no-cross-review.md
  metadata:
    playbook: groom
    step: draft-plan
    fixture: no-cross-review
    tier: smoke
  assert:
    - *a_file
    - *a_identity
    - *a_cli_sections
    - *a_milestones
    - *a_dod_parity
    - *a_sp
    # NO-RISK-REGISTER — nothing was deferred, `cli` defines no such section
    - type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'plans/.+/plan\.md$'
        rules: |
          - select: H1 > SECTION("Risk register")
            count: 0
    # NO-REVIEW-LINE + RETURN-SHAPE — Changed as above; Notes' third line names no agent,
    # no findings, no severity vocabulary
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        sections:
          - name: Changed
            entry: '^-\s+\[(UPDATED)\]\s+`?([^`\s]+)`?\s+—\s+template\s+`cli`,\s+\d+\s+SP$'
            matchManifest: true
            statuses: [UPDATED]
            minEntries: 1
            maxEntries: 1
          - name: Notes
            entry: '^-\s+\S.*$'
            fold: true
            minEntries: 3
            maxEntries: 3
        onlyListed: true
    - type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        on: return
        rules: |
          - select: UL > LI[text*="cross-review"]
            count: 1
            require: '(?i)no.*cross_review.*configured'
            forbid: '(?i)CRITICAL|RISK|NOTE:'

- description: draft-plan regress — an unreviewed draft still holds the line on no-cross-review
  vars:
    input: file://_fixtures/no-cross-review.md
  metadata:
    playbook: groom
    step: draft-plan
    fixture: no-cross-review
    tier: regress
  assert:
    - type: llm-rubric
      value: "NO-INVENTED-REVIEW: no reviewer-flavoured content anywhere in the plan — no findings list, no \"per review\" hedge, no severity vocabulary."
    - type: llm-rubric
      value: "DRAFT-UNWEAKENED: the plan meets the same bar as the reviewed run — full template section set, SP arithmetic consistent, a `Verify` and per-task DoD on every milestone."

- description: draft-plan smoke — a settled call stays settled on critical-reopens-design
  vars:
    input: file://_fixtures/critical-reopens-design.md
  metadata:
    playbook: groom
    step: draft-plan
    fixture: critical-reopens-design
    tier: smoke
  assert:
    - *a_file
    - *a_identity
    - *a_cli_sections
    - *a_milestones
    - *a_dod_parity
    - *a_sp
    # REOPEN-NOTE-RETURNED + RETURN-SHAPE — Changed as above; Notes carries the usual three
    # lines plus a fourth naming the routed-back finding
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        sections:
          - name: Changed
            entry: '^-\s+\[(UPDATED)\]\s+`?([^`\s]+)`?\s+—\s+template\s+`cli`,\s+\d+\s+SP$'
            matchManifest: true
            statuses: [UPDATED]
            minEntries: 1
            maxEntries: 1
          - name: Notes
            entry: '^-\s+\S.*$'
            fold: true
            minEntries: 4
        onlyListed: true
    - type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        on: return
        rules: |
          - select: UL > LI[text=/(?i)commit/][text=/(?i)(reopen|settl)/]
            min: 1
            require: '(?i)design'
    # SETTLED-CALL-INTACT (shape half) — the reviewer's alternative ("drop commit-run", "commit
    # per transition") never lands as plan text
    - type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'plans/.+/plan\.md$'
        rules: |
          - select: DOCUMENT
            forbid: '(?i)drop\s+`?commit-run`?'
          - select: DOCUMENT
            forbid: '(?i)commit\s+per\s+transition'

- description: draft-plan regress — the reopened finding travels back, everything else lands, on critical-reopens-design
  vars:
    input: file://_fixtures/critical-reopens-design.md
  metadata:
    playbook: groom
    step: draft-plan
    fixture: critical-reopens-design
    tier: regress
  assert:
    - type: llm-rubric
      value: "TRAP-NO-PARTIAL-FOLD: the finding is acted on nowhere in the plan — not as a hedge in Architecture, not as a DoD item, not as a risk-register deferral dressed up as agreement."
    - type: llm-rubric
      value: "TRAP-OTHERS-STILL-HANDLED: the accompanying NOTE is disposed on its own merits and the drafting is otherwise complete — the routed-back CRITICAL does not stall the plan or become a `## Questions:` section."

- description: draft-plan smoke — a template is authored when none fits, on no-template-fits
  vars:
    input: file://_fixtures/no-template-fits.md
  metadata:
    playbook: groom
    step: draft-plan
    fixture: no-template-fits
    tier: smoke
  assert:
    - *a_identity
    - *a_milestones
    - *a_dod_parity
    - *a_sp
    # NEW-TEMPLATE-WRITTEN (file half) — the plan, updated, plus a freshly authored template
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        onTextMode: fail
        expect:
          - path: 'plans/20260801-sprints-report-script/plan\.md$'
            minLines: 40
          - path: 'plan_templates/[a-z0-9_-]+\.md$'
            minLines: 15
        noOthers: true
    # NEW-TEMPLATE-WRITTEN (template shape) — frontmatter name + description, both top-level
    # sections present in order
    - type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'plan_templates/.+\.md$'
        rules: |
          - select: FRONTMATTER
            has:
              name: '^\S.*$'
              description: '^\S.*$'
          - select: DOCUMENT > H1
            ordered: [Plan Body, Quality Checklist]
            strict: true
    # NEW-TEMPLATE-WRITTEN (return half) — plan [UPDATED], template [CREATED]
    - type: javascript
      value: |
        const ret = /<return>\n([\s\S]*?)\n<\/return>/.exec(output);
        if (!ret) return { pass: false, score: 0, reason: 'no <return> block' };
        const changed = /## Changed:\n([\s\S]*?)(?:\n## |\n?$)/.exec(ret[1]);
        const lines = changed ? changed[1].split('\n').filter((l) => l.trim()) : [];
        const planLine = lines.find((l) => /plans\/20260801-sprints-report-script\/plan\.md/.test(l));
        const templateLine = lines.find((l) => /plan_templates\//.test(l));
        if (!planLine || !/\[UPDATED\]/.test(planLine))
          return { pass: false, score: 0, reason: 'plan entry missing or not [UPDATED]: ' + (planLine || 'absent') };
        if (!templateLine || !/\[CREATED\]/.test(templateLine))
          return { pass: false, score: 0, reason: 'template entry missing or not [CREATED]: ' + (templateLine || 'absent') };
        return { pass: true, score: 1, reason: 'plan [UPDATED], template [CREATED]' };
    # TRAP-NO-BAD-FIT-CLAIM — neither cut catalogue entry is named as the chosen template
    - type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        on: return
        rules: |
          - select: DOCUMENT
            forbid: '(?i)template\s+`?(frontend|documentation)`?[,\s]'

- description: draft-plan regress — the new template is used and stays reusable, on no-template-fits
  vars:
    input: file://_fixtures/no-template-fits.md
  metadata:
    playbook: groom
    step: draft-plan
    fixture: no-template-fits
    tier: regress
  assert:
    - type: llm-rubric
      value: "TRAP-PLAN-AGAINST-NEW: the plan body follows the authored template's `# Plan Body` section for section in its order, and the reported checklist verdict is against that template's own `# Quality Checklist` — not an improvised shape with a template named after it."
    - type: llm-rubric
      value: "NEW-TEMPLATE-REUSABLE: the authored template is generic for its surface — named and described for the surface class, placeholders throughout, no path, milestone or SP value from this run baked in."
