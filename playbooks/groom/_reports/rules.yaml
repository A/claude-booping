doc: groom-report

rules:
  - select: SECTION("Available Agents") > TABLE
    id: groom.agents-table
    count: 1
    columns: [agent, good for, bad for]

  - select: DOCUMENT H2
    id: groom.sections
    ordered:
      - Available Agents
      - Shared instructions
      # Rendered only under `core.tracker.driver: linear`; the hermetic fixture
      # configures no tracker, so the committed report carries no such section.
      - "Tracker driver: `linear`?"
      - Playbook Steps
      - State
      - "Step: Intake"
      - "Step: Research Codebase"
      - "Step: Research Web"
      - "Step: Draft Plan"
      - "Step: Cross Review"
      - "Step: Present"
