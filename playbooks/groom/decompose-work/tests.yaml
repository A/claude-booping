            matchManifest: true
            seededVar: input
            minEntries: 1
            maxEntries: 1
          - name: Notes
            fold: true
            minEntries: 1
          - name: Questions
            entry: '^\d+\.\s+.+'
            minEntries: 0
            maxEntries: 0
        onlyListed: true

- description: decompose-work regress — skip rationale grounded on right-sized-plan
  vars:
    input: file://_fixtures/right-sized-plan.md
  metadata:
    playbook: groom
    step: decompose-work
    fixture: right-sized-plan
    tier: regress
  assert:
    - type: llm-rubric
      value: "SKIP-GROUNDED: the Verdict's rationale cites the fixture's own figures — the largest task sitting at 3 SP against the 5 SP re-decompose threshold, the 9 SP sprint against the 35 SP split threshold — not a generic claim that the plan is already right-sized."

- description: decompose-work smoke — skip verdict with a flagged split on split-only-plan
  vars:
    input: file://_fixtures/split-only-plan.md
  metadata:
    playbook: groom
    step: decompose-work
    fixture: split-only-plan
    tier: smoke
  assert:
    # TRAP-NO-FAKE-SPLITS(plan untouched)
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        onTextMode: fail
        expect:
          - path: '_runs/groom/20260801-notification-center/decomposition\.md$'
            minLines: 5
        noOthers: true
    # TRAP-SPLIT-FLAGGED + TRAP-BOTH-COUNTS + TRAP-NO-FAKE-SPLITS(sections absent)
    - type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'decomposition\.md$'
        rules: |
          - select: H1
            count: 1
            match: 'Decomposition — 20260801-notification-center'

          - select: H1 > H2
            ordered: [Verdict, "Split candidate"]
            strict: true

          - select: SECTION("Verdict") > P
            count: 1
            require: '^Skipped\b'

          - select: SECTION("Verdict") > P
            require: '35 SP'

          - select: SECTION("Verdict") > P
            require: '41 SP'

          - select: SECTION("Split candidate") > UL > LI
            min: 2
    # TRAP-SPLIT-FLAGGED(the two SP figures sum to the sprint total) + TRAP-NO-FAKE-SPLITS(plan
    # absent from both the manifest and the return)
    - type: javascript
      value: |
        const fail = (r) => ({ pass: false, score: 0, reason: r });
        const ok = (r) => ({ pass: true, score: 1, reason: r });
        if (/^[ \t]*<file path="plans\//m.test(output))
          return fail('a plan file was written even though nothing sat at or over the re-decompose threshold');
        const ret = /<return>\n([\s\S]*?)\n<\/return>/.exec(output);
        if (ret && /plans\//.test(ret[1]))
          return fail('the return mentions a plans/ path even though nothing was re-decomposed');
        const FILE_RE = /^[ \t]*<file path="([^"]+)">\n([\s\S]*?)\n<\/file>[ \t]*$/gm;
        const files = {};
        let fm;
        while ((fm = FILE_RE.exec(output))) files[fm[1]] = fm[2];
        const decompPath = Object.keys(files).find((p) => /decomposition\.md$/.test(p));
        if (!decompPath) return fail('decomposition.md not in the written-files manifest');
        const decomp = files[decompPath];
        if (/^reviewed_at:/m.test(decomp))
          return fail('decomposition.md must not author a `reviewed_at:` key');
        const splitSection = /## Split candidate\n([\s\S]*?)(?:\n## |\n?$)/.exec(decomp);
        if (!splitSection) return fail('decomposition.md carries no ## Split candidate section');
        const primary = /\*\*Primary\*\*[^\n]*?(\d+)\s*SP/.exec(splitSection[1]);
        const sibling = /\*\*Sibling\*\*[^\n]*?(\d+)\s*SP/.exec(splitSection[1]);
        if (!primary || !sibling) return fail('Split candidate does not name both Primary and Sibling with their SP');
        if (Number(primary[1]) + Number(sibling[1]) !== 41)
          return fail(`Primary ${primary[1]} SP + Sibling ${sibling[1]} SP != the fixture's own sprint total 41`);
        return ok(`split candidate ${primary[1]}/${sibling[1]} SP sums to 41, plan untouched`);

- description: decompose-work regress — real seam argued on split-only-plan
  vars:
    input: file://_fixtures/split-only-plan.md
  metadata:
    playbook: groom
