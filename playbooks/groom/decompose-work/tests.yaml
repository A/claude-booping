# decompose-work — two thresholds judged separately, so every fixture pins BOTH a redecompose
# outcome and a split outcome. The step writes the `## Refinement` section of the run's
# `index.md` (verdict LINE first, then its H3s) and, on the refined path only, the plan itself;
# it asks the user nothing, so no fixture may come back with a `## Questions:` section — the
# user's first read of the plan is at `present`. The Re-decomposed table's own header repeats
# `SP` for both its Was and Became columns, so no rule ever addresses a cell by `TD[col="SP"]`
# (ambiguous with a duplicate header) — table-cell arithmetic (row counts, milestone/sprint
# sums, the Primary + Sibling SP split) rides in a plain-text javascript assert against the
# materialized files instead, matching the "manifest arithmetic" carve-out for JS asserts. Every
# inline `javascript` assert below is written as a function BODY — a bare sequence of statements
# ending in a top-level `return`, no wrapping `function(){}` — per the promptfoo contract the
# provider runs it under. `mdcheck`'s `enum:` values are raw strings (`"null"`, never YAML
# `null`), and `rows:` only bounds a `TABLE`'s body rows — a `UL`'s count is `min:`/`count:` on
# its `LI`s, never `rows:`.

- description: decompose-work smoke — refined split on oversized-plan
  vars:
    input: file://_fixtures/oversized-plan.md
  metadata:
    playbook: groom
    step: decompose-work
    fixture: oversized-plan
    tier: smoke
  assert:
    # FILE-AT-PATH + NO-SIBLING-CREATED — exactly the run index and the refined plan, both in
    # the plan directory, nothing else anywhere in the manifest (no sibling plan, no stub)
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        onTextMode: fail
        expect:
          - path: '^plans/20260801-local-vault-directories/index\.md$'
            minLines: 40
          - path: '^plans/20260801-local-vault-directories/plan\.md$'
            minLines: 100
        noOthers: true
    # SECTIONS-REFINED + SECTIONS-PRESERVED — the shared Refined shape (verdict line, then its
    # H3s, with the upstream sections untouched beside it), reused by entangled-oversize below
    - &a_refined_shape
      type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'plans/.+/index\.md$'
        rules: |
          - select: FRONTMATTER
            has:
              status: { enum: [decomposing] }

          - select: H1
            count: 1

          - select: H1 > H2
            ordered: [Framing, Blast radius, Design, Refinement]
            strict: true

          - select: SECTION("Refinement") > P
            count: 1
            require: '^Refined\b'
    # VERDICT-COUNTS + REDECOMPOSED-TABLE(shape) + TOTALS-RESUMMED(shape) +
    # SPLIT-CANDIDATE-SHAPE(list present)
    - type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'plans/.+/index\.md$'
        rules: |
          - select: SECTION("Refinement") > H3
            ordered: [Re-decomposed, Totals, "Split candidate"]
            strict: true

          - select: SECTION("Refinement") > P
            require: '5 SP'

          - select: SECTION("Refinement") > P
            require: '35 SP'

          - select: SECTION("Re-decomposed") > TABLE
            columns: [Was, SP, Became, SP]
            rows: { min: 4 }

          - select: SECTION("Totals") > TABLE
            columns: [Milestone, Before, After]
            rows: { min: 6, max: 6 }

          - select: SECTION("Split candidate") > UL > LI
            min: 2
    # PLAN-TASKS-REPLACED + NO-TASK-OVERSIZED + PLAN-SP-SYNCED + TOTALS-RESUMMED(the After
    # figures against the plan's own tasks) + SPLIT-CANDIDATE-SHAPE(the two SP figures sum to
    # the sprint total) — cross-artifact arithmetic no mdcheck rule can address without a
    # `TD[col="SP"]` ambiguity
    - type: javascript
      value: |
        const fail = (r) => ({ pass: false, score: 0, reason: r });
        const ok = (r) => ({ pass: true, score: 1, reason: r });
        const FILE_RE = /^[ \t]*<file path="([^"]+)">\n([\s\S]*?)\n<\/file>[ \t]*$/gm;
        const files = {};
        let fm;
        while ((fm = FILE_RE.exec(output))) files[fm[1]] = fm[2];
        const planPath = Object.keys(files).find((p) => /^plans\/20260801-local-vault-directories\/plan\.md$/.test(p));
        const indexPath = Object.keys(files).find((p) => /^plans\/20260801-local-vault-directories\/index\.md$/.test(p));
        if (!planPath) return fail('plan.md not in the written-files manifest');
        if (!indexPath) return fail('index.md not in the written-files manifest');
        const plan = files[planPath];
        const index = files[indexPath];
        const refinement = /## Refinement\n([\s\S]*?)(?:\n## |\n?$)/.exec(index);
        if (!refinement) return fail('index.md carries no ## Refinement section');
        const TASK_ROW = /^\|[^|]+\|[^|]*\|[^|]*\|\s*(\d+)\s*\|\s*\w+\s*\|\s*$/gm;
        const blocks = plan.split(/\n(?=### M\d+:)/);
        const heading = {}, taskSum = {}, oversized = [];
        for (const b of blocks) {
          const h = /^### (M\d+):[^\n]*?—\s*(\d+)\s*SP/.exec(b);
          if (!h) continue;
          const id = h[1];
          heading[id] = Number(h[2]);
          let sum = 0, t;
          TASK_ROW.lastIndex = 0;
          while ((t = TASK_ROW.exec(b))) {
            const sp = Number(t[1]);
            sum += sp;
            if (sp >= 5) oversized.push(`${id} task at ${sp} SP`);
          }
          taskSum[id] = sum;
        }
        if (oversized.length) return fail('task(s) still at or over the 5 SP threshold: ' + oversized.join(', '));
        for (const id of Object.keys(heading))
          if (heading[id] !== taskSum[id])
            return fail(`${id} heading says ${heading[id]} SP but its own tasks sum to ${taskSum[id]}`);
        const sprintTotal = Object.values(taskSum).reduce((a, b) => a + b, 0);
        const spMatch = /\nsp:\s*(\d+)\n/.exec(plan);
        if (!spMatch) return fail('plan frontmatter carries no `sp:`');
        if (Number(spMatch[1]) !== sprintTotal)
          return fail(`plan sp: ${spMatch[1]} does not equal the milestones' own sum ${sprintTotal}`);
        if (sprintTotal !== 38)
          return fail(`re-decomposition changed the sprint total to ${sprintTotal} — it must redistribute, never reduce or inflate, the fixture's own 38`);
        const totalsSection = /### Totals\n([\s\S]*?)(?:\n#{2,3} |\n?$)/.exec(refinement[1]);
        if (!totalsSection) return fail('the Refinement section carries no ### Totals subsection');
        for (const row of totalsSection[1].matchAll(/\|\s*(M\d+)[^|]*\|\s*(\d+)\s*\|\s*(\d+)\s*\|/g)) {
          const [, id, , after] = row;
          if (Number(after) !== taskSum[id])
            return fail(`Totals After for ${id} is ${after} but the plan's own tasks sum to ${taskSum[id]}`);
        }
        const sprintRow = /\*\*Sprint\*\*\s*\|\s*\*\*(\d+)\*\*\s*\|\s*\*\*(\d+)\*\*/.exec(totalsSection[1]);
        if (!sprintRow) return fail('Totals carries no bold **Sprint** row');
        if (Number(sprintRow[2]) !== sprintTotal)
          return fail(`Totals Sprint After is ${sprintRow[2]}, expected ${sprintTotal}`);
        const splitSection = /### Split candidate\n([\s\S]*?)(?:\n#{2,3} |\n?$)/.exec(refinement[1]);
        if (!splitSection) return fail('the Refinement section carries no ### Split candidate subsection');
        const primary = /\*\*Primary\*\*[^\n]*?(\d+)\s*SP/.exec(splitSection[1]);
        const sibling = /\*\*Sibling\*\*[^\n]*?(\d+)\s*SP/.exec(splitSection[1]);
        if (!primary || !sibling) return fail('Split candidate does not name both Primary and Sibling with their SP');
        if (Number(primary[1]) + Number(sibling[1]) !== sprintTotal)
          return fail(`Primary ${primary[1]} SP + Sibling ${sibling[1]} SP != sprint total ${sprintTotal}`);
        const redecompSection = /### Re-decomposed\n([\s\S]*?)(?:\n#{2,3} |\n?$)/.exec(refinement[1]);
        if (!redecompSection) return fail('the Refinement section carries no ### Re-decomposed subsection');
        if (!/\bM2\b/.test(redecompSection[1]) || !/\bM4\b/.test(redecompSection[1]))
          return fail('Re-decomposed does not show both oversized tasks (M2 and M4) as Was rows');
        const rows = (redecompSection[1].match(/^\|.*\|\s*$/gm) || []).filter((l) => !/^\|\s*-+\s*\|/.test(l));
        const bodyRows = rows.length - 1;
        if (bodyRows < 4)
          return fail(`Re-decomposed carries ${bodyRows} row(s), expected >= 4 (2 oversized tasks x >= 2 replacements each)`);
        return ok(`sprint ${sprintTotal} SP, ${bodyRows} re-decomposed rows, split ${primary[1]}/${sibling[1]} SP`);
    # RETURN-ANNOTATED + NO-GATE — two annotated entries, and no `## Questions:` section at all:
    # this step pauses the run for nothing, and the sizing call travels as a Notes line for
    # `present` to put to the user
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        sections:
          - name: Changed
            entry: '^-\s+\[(CREATED|UPDATED)\]\s+`?([^`\s]+)`?\s+—\s+\S.*$'
            matchManifest: true
            seededVar: input
            minEntries: 2
            maxEntries: 2
          - name: Notes
            fold: true
            minEntries: 1
        onlyListed: true

- description: decompose-work regress — split quality and plan fidelity on oversized-plan
  vars:
    input: file://_fixtures/oversized-plan.md
  metadata:
    playbook: groom
    step: decompose-work
    fixture: oversized-plan
    tier: regress
  assert:
    - type: llm-rubric
      value: "SPLITS-STAND-ALONE: every replacement task's DoD and Verify are satisfiable on their own — no replacement's Verify depends on a sibling replacement having already landed. Fails on any pair where the first half's Verify only passes once the second half exists."
    - type: llm-rubric
      value: "SPLITS-AT-SEAMS: task 2.1 (resolve the vault path from the marker) splits at the seam its own DoD bullets already carry — reading the marker's `vault_path:` key vs. resolving relative/absolute/`~` forms against the repo root — and task 4.1 (scaffold a repo-local vault) splits at its own seam — adding the `--local [dir]` flag and its default vs. writing the marker key and the vault `.gitignore`. Fails if either split is an arbitrary 'part 1' / 'part 2' halving instead of a seam in the task's own listed work."
    - type: llm-rubric
      value: "NOTHING-ELSE-TOUCHED: the surviving tasks (everything outside M2's 2.1 and M4's 4.1), their DoD, their Verify, the Context/Decisions/Architecture sections, `summary:`, and the Key Files Reference / Final Verification / Out of scope / CLAUDE.md impact sections come through unchanged from the fixture — only the two split tasks and the SP figures differ. In `index.md`, `## Framing`, `## Blast radius` and `## Design` come through untouched: the step added one section, it rewrote none."
    - type: llm-rubric
      value: "SEAM-ARGUED: the Split candidate argues the M3/M4 seam from the plan's own dependencies — M1–M3 deliver marker parsing, path resolution and every caller honouring the override as a shippable local-vault-directories feature on their own, while M4–M5 (scaffolding and docs) are useless without that resolution logic already landed. Fails on a seam argued from SP size alone."
    - type: llm-rubric
      value: "NO-USER-GATE: the reply asks the user nothing — no question, no confirmation, no request to approve the split. The sizing call that is the user's travels as a `## Notes:` line for `present` to put to them. Fails on any question put to the user, however phrased."

- description: decompose-work smoke — skip verdict on right-sized-plan
  vars:
    input: file://_fixtures/right-sized-plan.md
  metadata:
    playbook: groom
    step: decompose-work
    fixture: right-sized-plan
    tier: smoke
  assert:
    # SKIP-SECTION-WRITTEN + SKIP-PLAN-UNTOUCHED(absent from manifest)
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        onTextMode: fail
        expect:
          - path: '^plans/20260801-fix-stale-session-cookie/index\.md$'
            minLines: 40
        noOthers: true
    # SKIP-VERDICT-ONLY — the verdict line and nothing under it: under both thresholds the
    # section drops its subsections entirely, `### Split candidate` included
    - type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'plans/.+/index\.md$'
        rules: |
          - select: H1 > H2
            ordered: [Framing, Blast radius, Design, Refinement]
            strict: true

          - select: SECTION("Refinement") > P
            count: 1
            require: '^Skipped\b'

          - select: SECTION("Refinement") > H3
            count: 0
    # SKIP-VERDICT-COUNTS — the verdict line carries the fixture's own four figures
    - type: javascript
      value: |
        const fail = (r) => ({ pass: false, score: 0, reason: r });
        const ok = (r) => ({ pass: true, score: 1, reason: r });
        const FILE_RE = /^[ \t]*<file path="([^"]+)">\n([\s\S]*?)\n<\/file>[ \t]*$/gm;
        const files = {};
        let fm;
        while ((fm = FILE_RE.exec(output))) files[fm[1]] = fm[2];
        const indexPath = Object.keys(files).find((p) => /\/index\.md$/.test(p));
        if (!indexPath) return fail('index.md not in the written-files manifest');
        const refinement = /## Refinement\n([\s\S]*?)(?:\n## |\n?$)/.exec(files[indexPath]);
        if (!refinement) return fail('index.md carries no ## Refinement section');
        for (const figure of ['5 SP', '3 SP', '9 SP', '35 SP'])
          if (!refinement[1].includes(figure))
            return fail(`the verdict does not carry the fixture's own figure \`${figure}\``);
        return ok("the verdict carries the fixture's own 5/3/9/35 SP figures");
    # SKIP-RETURN + NO-GATE
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        sections:
          - name: Changed
            entry: '^-\s+\[(CREATED|UPDATED)\]\s+`?([^`\s]+)`?\s+—\s+\S.*$'
            matchManifest: true
            seededVar: input
            minEntries: 1
            maxEntries: 1
          - name: Notes
            fold: true
            minEntries: 1
        onlyListed: true

- description: decompose-work regress — skip rationale grounded on right-sized-plan
  vars:
    input: file://_fixtures/right-sized-plan.md
  metadata:
    playbook: groom
    step: decompose-work
    fixture: right-sized-plan
    tier: regress
  assert:
    - type: llm-rubric
      value: "SKIP-GROUNDED: the verdict line's rationale cites the fixture's own figures — the largest task sitting at 3 SP against the 5 SP re-decompose threshold, the 9 SP sprint against the 35 SP split threshold — and says the plan file was not touched, rather than making a generic claim that the plan is already right-sized."

- description: decompose-work smoke — skip verdict with a flagged split on split-only-plan
  vars:
    input: file://_fixtures/split-only-plan.md
  metadata:
    playbook: groom
    step: decompose-work
    fixture: split-only-plan
    tier: smoke
  assert:
    # TRAP-NO-FAKE-SPLITS(plan untouched)
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        onTextMode: fail
        expect:
          - path: '^plans/20260801-notification-center/index\.md$'
            minLines: 40
        noOthers: true
    # TRAP-SPLIT-FLAGGED + TRAP-BOTH-COUNTS + TRAP-NO-FAKE-SPLITS(subsections absent)
    - type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'plans/.+/index\.md$'
        rules: |
          - select: H1 > H2
            ordered: [Framing, Blast radius, Design, Refinement]
            strict: true

          - select: SECTION("Refinement") > P
            count: 1
            require: '^Skipped\b'

          - select: SECTION("Refinement") > P
            require: '35 SP'

          - select: SECTION("Refinement") > P
            require: '41 SP'

          - select: SECTION("Refinement") > H3
            ordered: ["Split candidate"]
            strict: true

          - select: SECTION("Split candidate") > UL > LI
            min: 2
    # TRAP-SPLIT-FLAGGED(the two SP figures sum to the sprint total) + TRAP-NO-FAKE-SPLITS(the
    # plan file absent from both the manifest and the return)
    - type: javascript
      value: |
        const fail = (r) => ({ pass: false, score: 0, reason: r });
        const ok = (r) => ({ pass: true, score: 1, reason: r });
        if (/^[ \t]*<file path="plans\/[^"]*plan\.md">/m.test(output))
          return fail('the plan file was written even though nothing sat at or over the re-decompose threshold');
        const ret = /<return>\n([\s\S]*?)\n<\/return>/.exec(output);
        if (ret && /plan\.md/.test(ret[1]))
          return fail('the return names plan.md even though nothing was re-decomposed');
        const FILE_RE = /^[ \t]*<file path="([^"]+)">\n([\s\S]*?)\n<\/file>[ \t]*$/gm;
        const files = {};
        let fm;
        while ((fm = FILE_RE.exec(output))) files[fm[1]] = fm[2];
        const indexPath = Object.keys(files).find((p) => /\/index\.md$/.test(p));
        if (!indexPath) return fail('index.md not in the written-files manifest');
        const refinement = /## Refinement\n([\s\S]*?)(?:\n## |\n?$)/.exec(files[indexPath]);
        if (!refinement) return fail('index.md carries no ## Refinement section');
        const splitSection = /### Split candidate\n([\s\S]*?)(?:\n#{2,3} |\n?$)/.exec(refinement[1]);
        if (!splitSection) return fail('the Refinement section carries no ### Split candidate subsection');
        const primary = /\*\*Primary\*\*[^\n]*?(\d+)\s*SP/.exec(splitSection[1]);
        const sibling = /\*\*Sibling\*\*[^\n]*?(\d+)\s*SP/.exec(splitSection[1]);
        if (!primary || !sibling) return fail('Split candidate does not name both Primary and Sibling with their SP');
        if (Number(primary[1]) + Number(sibling[1]) !== 41)
          return fail(`Primary ${primary[1]} SP + Sibling ${sibling[1]} SP != the fixture's own sprint total 41`);
        return ok(`split candidate ${primary[1]}/${sibling[1]} SP sums to 41, plan untouched`);

- description: decompose-work regress — real seam argued on split-only-plan
  vars:
    input: file://_fixtures/split-only-plan.md
  metadata:
    playbook: groom
    step: decompose-work
    fixture: split-only-plan
    tier: regress
  assert:
    - type: llm-rubric
      value: "TRAP-SEAM-REAL: the seam is argued from the plan's own dependencies — the delivery pipeline (M1–M3: event intake, fan-out/dedupe, transports and the in-app feed) ships notifications end to end on the built-in defaults without the preferences UI, while M4–M6 (preference model/API, preferences UI, digest schedule) need M2's resolver interface and M3's transports first. Fails if the seam is argued from the SP midpoint or from any grouping other than this dependency chain."

- description: decompose-work smoke — entangled task splits into a vertical slice on entangled-oversize
  vars:
    input: file://_fixtures/entangled-oversize.md
  metadata:
    playbook: groom
    step: decompose-work
    fixture: entangled-oversize
    tier: smoke
  assert:
    # TRAP-ENTANGLED-SPLIT(files) + NO-SIBLING-CREATED-equivalent for this fixture
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        onTextMode: fail
        expect:
          - path: '^plans/20260801-indexed-plan-store/index\.md$'
            minLines: 40
          - path: '^plans/20260801-indexed-plan-store/plan\.md$'
            minLines: 80
        noOthers: true
    # SECTIONS-REFINED shape — the same Refined contract as oversized-plan
    - *a_refined_shape
    # TRAP-ENTANGLED-SPLIT(shape) + TRAP-NO-SPLIT(shape: one line, no bullet list)
    - type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'plans/.+/index\.md$'
        rules: |
          - select: SECTION("Refinement") > H3
            ordered: [Re-decomposed, Totals, "Split candidate"]
            strict: true

          - select: SECTION("Refinement") > P
            require: '5 SP'

          - select: SECTION("Refinement") > P
            require: '35 SP'

          - select: SECTION("Re-decomposed") > TABLE
            columns: [Was, SP, Became, SP]
            rows: { min: 2 }

          - select: SECTION("Totals") > TABLE
            columns: [Milestone, Before, After]
            rows: { min: 5, max: 5 }

          - select: SECTION("Split candidate") > P
            count: 1
            require: '35 SP'

          - select: SECTION("Split candidate") > UL
            count: 0
    # TRAP-ENTANGLED-SPLIT(arithmetic: the 5 SP task is gone, no task >= 5, totals re-summed) +
    # TRAP-NO-SPLIT(no fabricated Primary/Sibling)
    - type: javascript
      value: |
        const fail = (r) => ({ pass: false, score: 0, reason: r });
        const ok = (r) => ({ pass: true, score: 1, reason: r });
        const FILE_RE = /^[ \t]*<file path="([^"]+)">\n([\s\S]*?)\n<\/file>[ \t]*$/gm;
        const files = {};
        let fm;
        while ((fm = FILE_RE.exec(output))) files[fm[1]] = fm[2];
        const planPath = Object.keys(files).find((p) => /^plans\/20260801-indexed-plan-store\/plan\.md$/.test(p));
        const indexPath = Object.keys(files).find((p) => /^plans\/20260801-indexed-plan-store\/index\.md$/.test(p));
        if (!planPath) return fail('plan.md not in the written-files manifest');
        if (!indexPath) return fail('index.md not in the written-files manifest');
        const plan = files[planPath];
        const refinement = /## Refinement\n([\s\S]*?)(?:\n## |\n?$)/.exec(files[indexPath]);
        if (!refinement) return fail('index.md carries no ## Refinement section');
        const TASK_ROW = /^\|[^|]+\|[^|]*\|[^|]*\|\s*(\d+)\s*\|\s*\w+\s*\|\s*$/gm;
        const blocks = plan.split(/\n(?=### M\d+:)/);
        const heading = {}, taskSum = {}, oversized = [];
        for (const b of blocks) {
          const h = /^### (M\d+):[^\n]*?—\s*(\d+)\s*SP/.exec(b);
          if (!h) continue;
          const id = h[1];
          heading[id] = Number(h[2]);
          let sum = 0, t;
          TASK_ROW.lastIndex = 0;
          while ((t = TASK_ROW.exec(b))) {
            const sp = Number(t[1]);
            sum += sp;
            if (sp >= 5) oversized.push(`${id} task at ${sp} SP`);
          }
          taskSum[id] = sum;
        }
        if (oversized.length) return fail('task(s) still at or over the 5 SP threshold: ' + oversized.join(', '));
        for (const id of Object.keys(heading))
          if (heading[id] !== taskSum[id])
            return fail(`${id} heading says ${heading[id]} SP but its own tasks sum to ${taskSum[id]}`);
        const sprintTotal = Object.values(taskSum).reduce((a, b) => a + b, 0);
        const spMatch = /\nsp:\s*(\d+)\n/.exec(plan);
        if (!spMatch) return fail('plan frontmatter carries no `sp:`');
        if (Number(spMatch[1]) !== sprintTotal)
          return fail(`plan sp: ${spMatch[1]} does not equal the milestones' own sum ${sprintTotal}`);
        if (sprintTotal !== 18)
          return fail(`re-decomposition changed the sprint total to ${sprintTotal} — it must redistribute, never reduce or inflate, the fixture's own 18`);
        if (/\*\*Primary\*\*/.test(refinement[1]))
          return fail('a split candidate was flagged even though the 18 SP sprint sits under the 35 SP threshold');
        const redecompSection = /### Re-decomposed\n([\s\S]*?)(?:\n#{2,3} |\n?$)/.exec(refinement[1]);
        if (!redecompSection) return fail('the Refinement section carries no ### Re-decomposed subsection');
        const rows = (redecompSection[1].match(/^\|.*\|\s*$/gm) || []).filter((l) => !/^\|\s*-+\s*\|/.test(l));
        const bodyRows = rows.length - 1;
        if (bodyRows < 2)
          return fail(`Re-decomposed carries ${bodyRows} row(s), expected >= 2 (the one oversized task split into >= 2 replacements)`);
        return ok(`sprint ${sprintTotal} SP unchanged, ${bodyRows} re-decomposed row(s), no split flagged`);

- description: decompose-work regress — vertical slice on entangled-oversize
  vars:
    input: file://_fixtures/entangled-oversize.md
  metadata:
    playbook: groom
    step: decompose-work
    fixture: entangled-oversize
    tier: regress
