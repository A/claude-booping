        for (const figure of ['5 SP', '3 SP', '9 SP', '35 SP'])
          if (!verdict[1].includes(figure))
            return fail(`Verdict does not carry the fixture's own figure \`${figure}\``);
        return ok('Verdict carries the fixture\'s own 5/3/9/35 SP figures');
    # SKIP-RETURN
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
