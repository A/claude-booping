- description: decompose-work smoke — entangled task splits into a vertical slice on entangled-oversize
  vars:
    input: file://_fixtures/entangled-oversize.md
  metadata:
    playbook: groom
    step: decompose-work
    fixture: entangled-oversize
    tier: smoke
  assert:
    # TRAP-ENTANGLED-SPLIT(files) + NO-SIBLING-CREATED-equivalent for this fixture
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        onTextMode: fail
        expect:
          - path: '_runs/groom/20260801-indexed-plan-store/decomposition\.md$'
            minLines: 10
          - path: '^plans/20260801-indexed-plan-store\.md$'
            minLines: 80
        noOthers: true
    # SECTIONS-REFINED shape — the same Refined contract as oversized-plan
    - *a_refined_shape
    # TRAP-ENTANGLED-SPLIT(shape) + TRAP-NO-SPLIT(shape: one line, no bullet list)
    - type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'decomposition\.md$'
        rules: |
          - select: H1
            match: 'Decomposition — 20260801-indexed-plan-store'

          - select: SECTION("Verdict") > P
            require: '5 SP'

          - select: SECTION("Verdict") > P
            require: '35 SP'

          - select: SECTION("Re-decomposed") > TABLE
            columns: [Was, SP, Became, SP]
            rows: { min: 2 }

          - select: SECTION("Totals") > TABLE
            columns: [Milestone, Before, After]
            rows: { min: 5, max: 5 }

          - select: SECTION("Split candidate") > P
            count: 1
            require: '35 SP'

          - select: SECTION("Split candidate") > UL
            count: 0
    # TRAP-ENTANGLED-SPLIT(arithmetic: the 5 SP task is gone, no task >= 5, totals re-summed) +
    # TRAP-NO-SPLIT(no fabricated Primary/Sibling)
    - type: javascript
      value: |
        const fail = (r) => ({ pass: false, score: 0, reason: r });
        const ok = (r) => ({ pass: true, score: 1, reason: r });
        const FILE_RE = /^[ \t]*<file path="([^"]+)">\n([\s\S]*?)\n<\/file>[ \t]*$/gm;
        const files = {};
        let fm;
        while ((fm = FILE_RE.exec(output))) files[fm[1]] = fm[2];
        const planPath = Object.keys(files).find((p) => /^plans\/20260801-indexed-plan-store\.md$/.test(p));
        const decompPath = Object.keys(files).find((p) => /decomposition\.md$/.test(p));
        if (!planPath) return fail('plan file not in the written-files manifest');
        if (!decompPath) return fail('decomposition.md not in the written-files manifest');
        const plan = files[planPath];
        const decomp = files[decompPath];
        if (/^reviewed_at:/m.test(decomp))
          return fail('decomposition.md must not author a `reviewed_at:` key');
        const TASK_ROW = /^\|[^|]+\|[^|]*\|[^|]*\|\s*(\d+)\s*\|\s*\w+\s*\|\s*$/gm;
        const blocks = plan.split(/\n(?=### M\d+:)/);
        const heading = {}, taskSum = {}, oversized = [];
        for (const b of blocks) {
          const h = /^### (M\d+):[^\n]*?—\s*(\d+)\s*SP/.exec(b);
          if (!h) continue;
          const id = h[1];
          heading[id] = Number(h[2]);
          let sum = 0, t;
          TASK_ROW.lastIndex = 0;
          while ((t = TASK_ROW.exec(b))) {
            const sp = Number(t[1]);
            sum += sp;
            if (sp >= 5) oversized.push(`${id} task at ${sp} SP`);
          }
          taskSum[id] = sum;
        }
        if (oversized.length) return fail('task(s) still at or over the 5 SP threshold: ' + oversized.join(', '));
        for (const id of Object.keys(heading))
          if (heading[id] !== taskSum[id])
            return fail(`${id} heading says ${heading[id]} SP but its own tasks sum to ${taskSum[id]}`);
        const sprintTotal = Object.values(taskSum).reduce((a, b) => a + b, 0);
        const spMatch = /\nsp:\s*(\d+)\n/.exec(plan);
        if (!spMatch) return fail('plan frontmatter carries no `sp:`');
        if (Number(spMatch[1]) !== sprintTotal)
          return fail(`plan sp: ${spMatch[1]} does not equal the milestones' own sum ${sprintTotal}`);
        if (sprintTotal !== 18)
          return fail(`re-decomposition changed the sprint total to ${sprintTotal} — it must redistribute, never reduce or inflate, the fixture's own 18`);
        if (/\*\*Primary\*\*/.test(decomp))
          return fail('a split candidate was flagged even though the 18 SP sprint sits under the 35 SP threshold');
        const redecompSection = /## Re-decomposed\n([\s\S]*?)(?:\n## |\n?$)/.exec(decomp);
        if (!redecompSection) return fail('decomposition.md carries no ## Re-decomposed section');
        const rows = (redecompSection[1].match(/^\|.*\|\s*$/gm) || []).filter((l) => !/^\|\s*-+\s*\|/.test(l));
        const bodyRows = rows.length - 1;
        if (bodyRows < 2)
          return fail(`Re-decomposed carries ${bodyRows} row(s), expected >= 2 (the one oversized task split into >= 2 replacements)`);
        return ok(`sprint ${sprintTotal} SP unchanged, ${bodyRows} re-decomposed row(s), no split flagged`);

- description: decompose-work regress — vertical slice on entangled-oversize
  vars:
    input: file://_fixtures/entangled-oversize.md
  metadata:
    playbook: groom
    step: decompose-work
    fixture: entangled-oversize
    tier: regress
  assert:
    - type: llm-rubric
      value: "TRAP-VERTICAL-SLICE: task 2.1 (move plan reads from flat files to the indexed store) splits into two vertical slices — each moving one read path (e.g. `render-sprints`, `transition`) end to end onto `PlanStore`, `Context.assemble()` populating `context.plans` from it — never an add-the-reader-then-delete-the-writer pair that leaves `PlanStore` half-wired with call sites still split between the old flat-file scan and the new store. Fails if either replacement task alone leaves some caller reading `plans/*.md` directly while another already reads through `PlanStore`, with no working state in between."
