# The step writes ONE section — `## Design` of the run's `index.md` — so every fixture's smoke
# case asserts the same two things: the section's own shape (five H3s, the "open recommendation
# or settled choice" shape per Trade-offs entry, the "names its mitigation" shape per Risks
# entry), and that the sections other steps own came through untouched. Anchored once, reused.
- description: design smoke — first pass on researched-first-pass
  vars:
    input: file://_fixtures/researched-first-pass.md
  metadata:
    playbook: groom
    step: design
    fixture: researched-first-pass
    tier: smoke
  assert:
    # FILE-AT-PATH — the run index is the only file the step touches; `plan.md` keeps its
    # identity frontmatter and is not opened
    - &a_file
      type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        onTextMode: fail
        expect:
          - path: 'plans/20260801-sprints-report-script/index\.md$'
            minLines: 40
        noOthers: true
    # SECTIONS + SECTIONS-PRESERVED + FRONTMATTER-PRESERVED + TRADEOFF-SHAPE + RISKS-MITIGATED
    - &a_shape
      type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'plans/.+/index\.md$'
        rules: |
          - select: FRONTMATTER
            has:
              status: { enum: [designing] }

          - select: H1 > H2
            ordered: [Framing, Blast radius, Design]
            strict: true

          - select: SECTION("Framing") > H3
            ordered: [Request, Restated problem, Task type, Scope boundaries, Web research, Scope challenge]
            strict: true

          - select: SECTION("Blast radius") > H3
            ordered: [Touched surfaces, Prior art, Conventions in play, Unknowns for design]
            strict: true

          - select: SECTION("Design") > H3
            ordered: [Approach, Surface changes, Alternatives, Trade-offs, Risks]
            strict: true

          - select: SECTION("Trade-offs") > UL > LI
            min_length: 80
            match: '(?s).*(?i)(recommended|settled).*'

          - select: SECTION("Risks") > UL > LI
            min_length: 40
            match: '(?s).*(?i)mitigat\w*.*'
    # QUESTIONS-MATCH (shape) — one [UPDATED] Changed entry naming the manifest, Questions
    # numbered, empty only when every call is answered
    - &a_return
      type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        sections:
          - name: Changed
            entry: '^-\s+\[(CREATED|UPDATED)\]\s+`?([^`\s]+)`?(\s+—\s+.+)?$'
            statuses: [UPDATED]
            matchManifest: true
            maxEntries: 1
          - name: Questions
            entry: '^\d+\.\s+.+'
            minEntries: 0
        onlyListed: true
    # QUESTIONS-MATCH (parity) — arithmetic across two documents (the Design section's own
    # Trade-offs count against the return's Questions count) that no _lib module
    # cross-references; the return.js call above already pins each section's own shape.
    - &a_parity
      type: javascript
      value: |
        const fileMatch = /<file path="[^"]*index\.md">\n([\s\S]*?)\n<\/file>/.exec(output);
        if (!fileMatch) return { pass: false, score: 0, reason: 'no index.md file block in output' };
        const tSection = /### Trade-offs\n([\s\S]*?)(?:\n#{2,3} |\n?$)/.exec(fileMatch[1]);
        const tradeoffs = tSection ? (tSection[1].match(/^- /gm) || []).length : 0;
        const returnMatch = /<return>\n([\s\S]*?)\n<\/return>/.exec(output);
        const qSection = returnMatch ? /## Questions:?\n([\s\S]*?)(?:\n## |\n?$)/.exec(returnMatch[1]) : null;
        const questions = qSection ? (qSection[1].match(/^\d+\.\s/gm) || []).length : 0;
        if (tradeoffs !== questions) {
          return { pass: false, score: 0, reason: `the Design section carries ${tradeoffs} Trade-offs entries but the return lists ${questions} Questions` };
        }
        return { pass: true, score: 1, reason: `${tradeoffs} Trade-offs == ${questions} Questions` };

- description: design regress — grounding and fidelity on researched-first-pass
  vars:
    input: file://_fixtures/researched-first-pass.md
  metadata:
    playbook: groom
    step: design
    fixture: researched-first-pass
    tier: regress
  assert:
    - type: llm-rubric
      value: "GROUNDED-IN-BLAST-RADIUS: Approach is argued against the fixture's real paths — `hooks.py`, `sprints.md.j2`, the `plan.hooks.post` list — with the rationale that made it win; no invented path."
    - type: llm-rubric
      value: "ANSWERS-UNKNOWN: the map's unknown (vault resolution from `BOOPING_WORKDIR` on a repo-local vault) is decided in Approach or surfaced as a trade-off or risk — never silently dropped."
    - type: llm-rubric
      value: "ALTERNATIVES-FROM-RESEARCH: the approaches `research.md` gathered and the design did not take appear in `### Alternatives`, each with the single reason it lost."
    - type: llm-rubric
      value: "PITFALLS-ANSWERED: each of the 3 pitfalls `research.md` names is designed against in Approach/Surface changes or carried into Risks with a mitigation."
    - type: llm-rubric
      value: "SURFACE-CONCRETE: Surface changes name implementable specifics — script name, config key removed from `plan.hooks.post`, env vars read, defaults — not \"config will change\"."
    - type: llm-rubric
      value: "USER-CALLS-ONLY: Trade-offs hold calls that are the user's (policy, cost, blast radius), not implementation details design should have settled itself."
    - type: llm-rubric
      value: "OTHER-SECTIONS-UNTOUCHED: `## Framing` and `## Blast radius` come through with their content intact — the step added a section, it did not rewrite, trim or re-word the ones upstream steps own."

- description: design smoke — loopback re-entry on loopback-objection
  vars:
    input: file://_fixtures/loopback-objection.md
  metadata:
    playbook: groom
    step: design
    fixture: loopback-objection
    tier: smoke
  assert:
    # FILE-AT-PATH — the same index, revised in place; still the only file written
    - *a_file
    # REVISED-IN-PLACE (section set) — same shared shape contract as the first-pass fixture,
    # so a loopback that appends a second design round or drops a sibling section fails here
    - *a_shape
    # REVISED-IN-PLACE (return) — same path, [UPDATED], one file only
    - *a_return
    - *a_parity

- description: design regress — objection handling on loopback-objection
  vars:
    input: file://_fixtures/loopback-objection.md
  metadata:
    playbook: groom
    step: design
    fixture: loopback-objection
    tier: regress
  assert:
    - type: llm-rubric
      value: "ONLY-REOPENED-REWRITTEN: subsections carrying settled calls come through unchanged in substance; only the vault-commit call and what depends on it is rewritten."
    - type: llm-rubric
      value: "OBJECTION-ADDRESSED: the rewritten call states the choice the objection asks for, and the displaced option moves into `### Alternatives` with the reason it lost."
    - type: llm-rubric
      value: "NO-ROUND-LOG: the `## Design` section is revised in place — no round, revision or changelog subsection is added, and no second copy of a subsection survives."

- description: design smoke — no web research requested, on skipped-research
  vars:
    input: file://_fixtures/skipped-research.md
  metadata:
    playbook: groom
    step: design
    fixture: skipped-research
    tier: smoke
  assert:
    # FILE-AT-PATH + NO-CITATIONS — with no `research.md` on disk, nothing external may appear
    # in the section this step writes
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        onTextMode: fail
        expect:
          - path: 'plans/20260801-fix-plan-date-stamp-timezone/index\.md$'
            minLines: 40
            forbids:
              - 'https?://'
              - '\|\s*\d{8}\s*\|'
        noOthers: true
    # section shape still holds with no research on disk — same shared contract
    - *a_shape

- description: design regress — no manufactured practice or calls on skipped-research
  vars:
    input: file://_fixtures/skipped-research.md
  metadata:
    playbook: groom
    step: design
    fixture: skipped-research
    tier: regress
  assert:
    - type: llm-rubric
      value: "NO-INVENTED-PRACTICE: no \"current practice\", library-comparison or version claim appears — with no `research.md` on disk the design argues from the blast radius and prior art alone, and the framing's `Not requested` line is not re-litigated."
    - type: llm-rubric
      value: "NO-MANUFACTURED-CALLS: `### Trade-offs` invents no call the fix does not carry (an explicit none is correct), and `## Questions:` matches it rather than padding."
