      config:
        file: 'research-web\.md$'
        rules: |
          - select: SECTION("Verdict") > P
            count: 1
            match: '(?s)^Researched\b.*\S$'

          - select: H1 > H2
            ordered: [Verdict, Approaches, Pitfalls, Sources]
            strict: true

- description: research-web regress — verdict grounded in novelty, not the signal list, on the signed-partner-webhooks framing
  vars:
    input: file://_fixtures/unsignalled-novelty.md
  metadata:
    playbook: groom
    step: research-web
    fixture: unsignalled-novelty
    tier: regress
  assert:
    - type: llm-rubric
      value: "TRAP-VERDICT-JUDGED: the rationale grounds the Researched verdict in the request's own novelty — RFC 9421 HTTP Message Signatures, which the repository has never implemented on any endpoint, with no in-house shape to copy — not in the fact that intake's uncertainty-signal list came back empty. Fails if the rationale cites the empty signal list as if it were evidence either way, instead of judging the request itself."
