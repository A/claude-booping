# research-web branches MECHANICALLY on the `### Web research` line intake wrote into
# `## Framing` — the step never judges whether the work is novel, well-trodden or worth
# researching. The two fixtures are that branch: one framing says Requested, the other says Not
# requested, and everything else about them is beside the point.

- description: research-web smoke — requested branch writes research.md on the export-admission-control framing
  vars:
    input: file://_fixtures/research-requested.md
  metadata:
    playbook: groom
    step: research-web
    fixture: research-requested
    tier: smoke
  assert:
    # FILE-AT-PATH — research.md in the plan directory, and nothing else written
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        onTextMode: fail
        expect:
          - path: 'plans/20260801-export-admission-control/research\.md$'
            minLines: 15
        noOthers: true
    # FILE-AT-PATH (H1) + SECTIONS + APPROACHES-SHAPED + SOURCES-DATED. No Verdict section:
    # the decision was intake's, so the artifact carries findings alone.
    - type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'research\.md$'
        rules: |
          - select: H1
            count: 1
            match: 'research — 20260801-export-admission-control'

          - select: H1 > H2
            ordered: [Approaches, Pitfalls, Sources]
            strict: true

          - select: SECTION("Approaches") > SECTION(/.+/)
            min: 2
            each:
              - select: UL > LI[text^="Fits:"]
                min: 1
              - select: UL > LI[text^="Costs:"]
                min: 1

          - select: SECTION("Pitfalls") > UL > LI
            min: 1

          - select: SECTION("Sources") > TABLE
            columns: [Source, Backs, Checked]
            rows: { min: 1 }

          - select: SECTION("Sources") > TABLE > TD[col="Source"]
            match: '^https://\S+$'

          - select: SECTION("Sources") > TABLE > TD[col="Checked"]
            match: '^\d{8}$'

          - select: SECTION("Sources") > TABLE > TD[col="Backs"]
            no_empty: true
    # RETURN-ANNOTATED — Changed/Notes shape, manifest agreement, CREATED status
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        sections:
          - name: Changed
            entry: '^-\s+\[(CREATED|UPDATED)\]\s+`?([^`\s]+)`?\s+—\s+\S.*$'
            matchManifest: true
            seededVar: input
            minEntries: 1
            maxEntries: 1
          - name: Notes
            fold: true
            minEntries: 1
        onlyListed: true
    # RETURN-ANNOTATED — the counts in the Changed annotation match the file, Notes carries a
    # recommendation line and a pitfall count
    - type: javascript
      value: |
        const fail = (r) => ({ pass: false, score: 0, reason: r });
        const ret = /<return>\n([\s\S]*?)\n<\/return>/.exec(output);
        if (!ret) return fail('no <return> block');
        const body = ret[1];
        const m = /\[(?:CREATED|UPDATED)\][^\n]*?(\d+)\s+approaches,\s*(\d+)\s+sources?/.exec(body);
        if (!m) return fail('Changed entry not annotated `{n} approaches, {m} sources`');
        const file = /<file path="[^"]*research\.md">\n([\s\S]*?)\n<\/file>/.exec(output);
        if (!file) return fail('no research.md in the files manifest');
        const approaches = (file[1].match(/^### /gm) || []).length;
        const sources = (file[1].match(/^\|\s*https:\/\//gm) || []).length;
        if (Number(m[1]) !== approaches || Number(m[2]) !== sources)
          return fail(`Changed says ${m[1]} approaches/${m[2]} sources, file has ${approaches}/${sources}`);
        if (!/^-\s+recommended:/m.test(body)) return fail('Notes carries no `recommended:` line');
        if (!/\bpitfall/i.test(body)) return fail('Notes carries no pitfall count');
        return { pass: true, score: 1, reason: `${approaches} approaches, ${sources} sources — Notes ok` };
    # NO-NOVELTY-JUDGMENT — the branch was intake's; nothing in the artifact or the return
    # re-argues whether the work was novel enough to research
    - type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'research\.md$'
        rules: |
          - select: DOCUMENT
            forbid: '(?i)(novel|well.trodden|worth researching|uncertainty signal)'

- description: research-web regress — content fidelity on the export-admission-control framing
  vars:
    input: file://_fixtures/research-requested.md
  metadata:
    playbook: groom
    step: research-web
    fixture: research-requested
    tier: regress
  assert:
    - type: llm-rubric
      value: "CLAIMS-SOURCED: every approach and every pitfall in research.md traces to a row of the Sources table — no claim rests on undated model memory. Fails on any approach, fit/cost line, or pitfall backed by no source row."
    - type: llm-rubric
      value: "TRADEOFFS-DECIDABLE: each approach's fit and cost are argued against this request's own constraints — the export endpoint's worker pool starving under concurrent exports, the shared cache tier already running in the deployment, the service-wide budget with a per-caller cap the user confirmed — not stated as generic pros and cons that would read the same on any admission-control request. Fails on a fit/cost line with nothing this-request-specific in it."
    - type: llm-rubric
      value: "PITFALLS-CONSTRAIN: each pitfall names the design call it forces on `design` — not a general caution left unresolved. Fails on a pitfall that reads as generic advice with no decision attached."
    - type: llm-rubric
      value: "SCOPE-RESPECTED: no approach is placed at the CDN or the reverse proxy in front of the service — the framing excluded that surface (owned by the platform team, blind to caller plan tier and export cost). Fails if any approach lives at the edge/CDN/proxy layer."
    - type: llm-rubric
      value: "BRANCH-EXECUTED: the run researched because the framing's `### Web research` line says Requested, and nowhere argues its own case for researching — no novelty assessment, no 'this is worth researching because…'. Fails if the step re-decides what intake already decided."

- description: research-web smoke — not-requested branch writes no research.md on the stale-session-cookie framing
  vars:
    input: file://_fixtures/research-not-requested.md
  metadata:
    playbook: groom
    step: research-web
    fixture: research-not-requested
    tier: smoke
  assert:
    # NO-RESEARCH-FILE — the whole negative: no research.md anywhere in what the run wrote.
    # index.md may or may not be rewritten (intake's framing already carries the skip line), so
    # the manifest is checked for the one path that must never appear.
    - type: javascript
      value: |
        const paths = [...output.matchAll(/<file path="([^"]+)">/g)].map((m) => m[1]);
        const research = paths.filter((p) => /research\.md$/.test(p));
        if (research.length)
          return { pass: false, score: 0, reason: 'research.md written on the not-requested branch: ' + research.join(', ') };
        const stray = paths.filter((p) => !/plans\/20260801-stale-session-cookie\/index\.md$/.test(p));
        if (stray.length)
          return { pass: false, score: 0, reason: 'wrote something other than the run index: ' + stray.join(', ') };
        return { pass: true, score: 1, reason: 'no research.md; ' + (paths.length ? 'index.md rewritten in place' : 'nothing written') };
    # SKIP-RETURN — one Changed entry, naming the run index and annotated with the skip; Notes
    # carries the skip line. matchManifest stays off: a step that found the line already there
    # legitimately writes nothing.
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        sections:
          - name: Changed
            entry: '^-\s+\[(CREATED|UPDATED)\]\s+`?([^`\s]+index\.md)`?\s+—\s+\S.*$'
            minEntries: 1
            maxEntries: 1
          - name: Notes
            fold: true
            minEntries: 1
        onlyListed: true
    # SKIP-RETURN — the annotation names the skip, and no finding, recommendation, pitfall or
    # source leaks onto the branch that researched nothing
    - type: javascript
      value: |
        const fail = (r) => ({ pass: false, score: 0, reason: r });
        const ret = /<return>\n([\s\S]*?)\n<\/return>/.exec(output);
        if (!ret) return fail('no <return> block');
        const body = ret[1];
        if (!/\[(?:CREATED|UPDATED)\][^\n]*(?:not requested|no(?:t)? request)/i.test(body))
          return fail('Changed entry not annotated `web research: not requested`');
        if (/recommended:|\bpitfall|https:\/\//i.test(body))
          return fail('the return carries a recommendation, a pitfall or a source on the not-requested branch');
        if (/novel|well.trodden|worth researching/i.test(body))
          return fail('the return re-judges the research decision instead of executing it');
        return { pass: true, score: 1, reason: 'skip annotation ok, nothing researched' };

- description: research-web regress — the skip executes intake's decision on the stale-session-cookie framing
  vars:
    input: file://_fixtures/research-not-requested.md
  metadata:
    playbook: groom
    step: research-web
    fixture: research-not-requested
    tier: regress
  assert:
    - type: llm-rubric
      value: "SKIP-IS-MECHANICAL: the run stops because the framing's `### Web research` line says Not requested, and for no other reason. Fails if the reply argues that the work is well-trodden, that the fix is obvious, that prior art exists, or in any other way justifies the skip on the merits — the decision was the user's, recorded at intake."
    - type: llm-rubric
      value: "NO-CONSOLATION-RESEARCH: nothing researched-shaped is produced anywhere — no approaches, no comparison of options, no external sources, not even as a short 'for reference' aside in the notes. Fails on any finding the step was not asked for."
    - type: llm-rubric
      value: "OPEN-QUESTION-LEFT-ALONE: the open external question the blast radius records (whether the framework's logout helper is still the recommended path on the pinned version) is not answered here — at most it is pointed at as the user's to escalate. Fails if the step goes and settles it anyway."
