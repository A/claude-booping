# present is the run's SINGLE review gate: it writes the `## Approval` section of the run's
# `index.md` — the user's first read of the plan — and the plan reaches `/develop` through this
# gate and no other. Every smoke case therefore pins both the section's own shape and the
# gate's behaviour: approval is explicit, a change request is handed back untouched, and the
# step edits neither the plan nor any other section of the index.

- description: present smoke — first pass, over threshold on over-threshold-local
  vars:
    input: file://_fixtures/over-threshold-local.md
  metadata:
    playbook: groom
    step: present
    fixture: over-threshold-local
    tier: smoke
  assert:
    # FILE-AND-FRONTMATTER (+ plan.md byte-identical, enforced by noOthers: a modified plan
    # would show up in the manifest and fail it)
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        onTextMode: fail
        expect:
          - path: '^plans/20260731-rate-limit-public-api/index\.md$'
            minLines: 40
            forbids:
              - '^reviewed_at:'
        noOthers: true
    # SECTIONS-ORDER + SECTIONS-PRESERVED + CHECKS-THREE (shape) + MILESTONES-TABLE (shape) +
    # PLAN-PATH-STATUS + SPLIT-SHAPE + BRANCH-PROPOSED
    - type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'plans/.+/index\.md$'
        rules: |
          - select: FRONTMATTER
            has:
              status: { enum: [presenting] }

          - select: H1 > H2
            ordered: [Framing, Blast radius, Design, Refinement, References, Approval]
            strict: true

          - select: SECTION("Approval") > H3
            ordered: [Summary, Milestones, Totals, Plan, Checks, "Split recommendation", Branch, Next]
            strict: true

          - select: SECTION("Checks") > UL > LI
            count: 3
            match: '(?s)^\*\*(Refinement|Cross-review|References)\*\*.*'

          - select: SECTION("Milestones") > TABLE
            columns: ["#", "Milestone", "SP", "Delivers"]
            rows: { min: 4, max: 4 }

          - select: SECTION("Plan")
            require: 'plans/20260731-rate-limit-public-api/plan\.md'
          - select: SECTION("Plan")
            require: 'awaiting-plan-review'

          - select: SECTION("Split recommendation") > UL > LI
            count: 2
            match: '(?s).*SP.*'
          - select: SECTION("Split recommendation")
            require: '(?i)approving the plan whole is also fine'

          - select: SECTION("Branch")
            require: 'git switch -c feat/rate-limit-public-api'
          - select: SECTION("Branch")
            require: 'current branch'
    # MILESTONES-TABLE (arithmetic) + TOTALS-VS-THRESHOLD — the fixture's own arithmetic: the
    # plan's own milestone SPs, re-summed, against the plan's own 44/35 figures.
    - type: javascript
      value: |
        const fm = /<file path="plans\/20260731-rate-limit-public-api\/index\.md">\n([\s\S]*?)\n<\/file>/.exec(output);
        if (!fm) return { pass: false, score: 0, reason: 'no index.md file block in output' };
        const approval = /## Approval\n([\s\S]*?)(?:\n## |\n?$)/.exec(fm[1]);
        if (!approval) return { pass: false, score: 0, reason: 'index.md carries no ## Approval section' };
        const content = approval[1];
        const mSection = /### Milestones\n([\s\S]*?)(?:\n#{2,3} |\n?$)/.exec(content);
        if (!mSection) return { pass: false, score: 0, reason: 'no Milestones subsection' };
        const sps = [...mSection[1].matchAll(/\|\s*\d+\s*\|[^|]*\|\s*(\d+)\s*\|/g)].map((m) => Number(m[1]));
        const expected = [8, 12, 9, 15];
        const got = [...sps].sort((a, b) => a - b);
        const want = [...expected].sort((a, b) => a - b);
        if (JSON.stringify(got) !== JSON.stringify(want))
          return { pass: false, score: 0, reason: `Milestones SP column is [${sps.join(', ')}], expected the plan's [${expected.join(', ')}]` };
        const sum = sps.reduce((a, b) => a + b, 0);
        if (sum !== 44)
          return { pass: false, score: 0, reason: `Milestones SPs sum to ${sum}, expected 44` };
        const tSection = /### Totals\n([\s\S]*?)(?:\n#{2,3} |\n?$)/.exec(content);
        if (!tSection) return { pass: false, score: 0, reason: 'no Totals subsection' };
        if (!/44/.test(tSection[1]) || !/35/.test(tSection[1]) || !/\bover\b/i.test(tSection[1]))
          return { pass: false, score: 0, reason: `Totals does not state 44 SP over the 35 SP threshold: ${tSection[1].trim()}` };
        return { pass: true, score: 1, reason: `Milestones SPs ${sps.join(', ')} sum to 44, Totals states it over the 35 SP threshold` };
    # RETURN-SHAPE — one entry, the run index, UPDATED (it was seeded with every earlier
    # section); the two questions are the approval ask and the branch offer
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        sections:
          - name: Changed
            entry: '^-\s+\[(CREATED|UPDATED)\]\s+`?([^`\s]+)`?(\s+—\s+.+)?$'
            statuses: [UPDATED]
            matchManifest: true
            seededVar: input
            maxEntries: 1
          - name: Notes
            entry: '^-\s+\S'
            minEntries: 1
          - name: Questions
            entry: '^\d+\.\s+.+'
            minEntries: 2
            maxEntries: 2
        onlyListed: true

- description: present regress — grounding and fidelity on over-threshold-local
  vars:
    input: file://_fixtures/over-threshold-local.md
  metadata:
    playbook: groom
    step: present
    fixture: over-threshold-local
    tier: regress
  assert:
    - type: llm-rubric
      value: "SP-ARITHMETIC: the milestone SPs sum to the stated 44 and that total is the plan's own — present re-sums, never re-estimates."
    - type: llm-rubric
      value: "CHECKS-OUTCOMES: each Checks entry states what was found and what became of it — CRITICAL folded into milestone 2, 2 NOTEs deferred to the risk register, `redis-py` floor 4.6 → 5.0 — never a bare \"passed\"."
    - type: llm-rubric
      value: "SUMMARY-HUMAN-FIRST: `### Summary` opens on what the plan does and why it matters, in a stakeholder's terms, before any milestone, SP figure or file path — and it restates the confirmed design's decision without introducing an architecture call the design did not make."
    - type: llm-rubric
      value: "ONE-SCREEN: the summary is decidable end to end without opening the plan, and no subsection drops to the plan's task-level detail."
    - type: llm-rubric
      value: "SOLE-GATE: `### Next` says approval hands the plan to `/develop` and names where a change request loops back to — milestones, tasks or estimates to the refinement pass, architecture or scope to the design. Fails if it names another review step, an intermediate confirmation, or no loopback at all."
    - type: llm-rubric
      value: "OTHER-SECTIONS-UNTOUCHED: `## Framing`, `## Blast radius`, `## Design`, `## Refinement` and `## References` come through unchanged — present summarises them, it does not rewrite them."

