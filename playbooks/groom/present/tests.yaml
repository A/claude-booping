- description: present smoke — approved whole on approved-whole
  vars:
    input: file://_fixtures/approved-whole.md
  metadata:
    playbook: groom
    step: present
    fixture: approved-whole
    tier: smoke
  assert:
    # NO-SIDE-EFFECTS (no sibling stub, no branch, no status write — enforced by noOthers: any
    # extra written or modified file, including plans/*.md, fails it)
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        onTextMode: fail
        expect:
          - path: '_runs/groom/20260731-14-02_rate-limit-public-api/handoff\.md$'
            minLines: 15
        noOthers: true
    # APPROVAL-RETURN (Changed [UPDATED] alone, Questions present and empty)
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        sections:
          - name: Changed
            entry: '^-\s+\[(CREATED|UPDATED)\]\s+`?([^`\s]+)`?$'
            statuses: [UPDATED]
            matchManifest: true
            seededVar: input
            maxEntries: 1
          - name: Notes
            entry: '^-\s+\S'
            minEntries: 1
          - name: Questions
            entry: '^\d+\.\s+.+'
            minEntries: 0
            maxEntries: 0
        onlyListed: true
    # DECISIONS-RECORDED — one decision: line for the whole-plan approval, one for the branch
    - type: javascript
      value: |
        const m = /## Notes:\n([\s\S]*?)(?:\n## |\n?$)/.exec(output);
        if (!m) return { pass: false, score: 0, reason: 'no ## Notes: section in the return' };
        const decisions = (m[1].match(/^-\s+decision:/gm) || []).length;
        if (decisions < 2)
          return { pass: false, score: 0, reason: `Notes carries ${decisions} \`decision:\` line(s), expected >= 2 (approval + branch)` };
        return { pass: true, score: 1, reason: `Notes carries ${decisions} decision: line(s)` };

