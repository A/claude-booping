- description: present smoke — first pass, over threshold on over-threshold-local
  vars:
    input: file://_fixtures/over-threshold-local.md
  metadata:
    playbook: groom
    step: present
    fixture: over-threshold-local
    tier: smoke
  assert:
    # FILE-AND-FRONTMATTER (+ plans/*.md byte-identical, enforced by noOthers: a modified plan
    # would show up in the manifest and fail it)
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        onTextMode: fail
        expect:
          - path: '_runs/groom/20260731-14-02_rate-limit-public-api/handoff\.md$'
            minLines: 15
            contains:
              - '^# handoff — 20260731-14-02_rate-limit-public-api$'
              - '^---\nreviewed_at: null\n---$'
        noOthers: true
    # SECTIONS-ORDER + CHECKS-THREE (shape) + MILESTONES-TABLE (shape) + PLAN-PATH-STATUS +
    # SPLIT-SHAPE + BRANCH-PROPOSED
    - type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'handoff\.md$'
        rules: |
          - select: H1 > H2
            ordered: [Approach, Milestones, Totals, Plan, Checks, "Split recommendation", Branch, Next]
            strict: true

          - select: SECTION("Checks") > UL > LI
            count: 3
            match: '(?s)^\*\*(Decomposition|Cross-review|References)\*\*.*'

          - select: SECTION("Milestones") > TABLE
            columns: ["#", "Milestone", "SP", "Delivers"]
            rows: { min: 4, max: 4 }

          - select: SECTION("Plan")
            require: 'plans/20260731-14-02_rate-limit-public-api\.md'
          - select: SECTION("Plan")
            require: 'awaiting-plan-review'

          - select: SECTION("Split recommendation") > UL > LI
            count: 2
            match: '(?s).*SP.*'
          - select: SECTION("Split recommendation")
            require: '(?i)approving the plan whole is also fine'

          - select: SECTION("Branch")
            require: 'git switch -c feat/rate-limit-public-api'
          - select: SECTION("Branch")
            require: 'current branch'
    # MILESTONES-TABLE (arithmetic) + TOTALS-VS-THRESHOLD — the fixture's own arithmetic: the
    # plan's own milestone SPs, re-summed, against the plan's own 44/35 figures.
    - type: javascript
      value: |
        const fm = /<file path="_runs\/groom\/20260731-14-02_rate-limit-public-api\/handoff\.md">\n([\s\S]*?)\n<\/file>/.exec(output);
        if (!fm) return { pass: false, score: 0, reason: 'no handoff.md file block in output' };
        const content = fm[1];
        const mSection = /## Milestones\n([\s\S]*?)(?:\n## |\n?$)/.exec(content);
        if (!mSection) return { pass: false, score: 0, reason: 'no Milestones section' };
        const sps = [...mSection[1].matchAll(/\|\s*\d+\s*\|[^|]*\|\s*(\d+)\s*\|/g)].map((m) => Number(m[1]));
        const expected = [8, 12, 9, 15];
        const got = [...sps].sort((a, b) => a - b);
        const want = [...expected].sort((a, b) => a - b);
        if (JSON.stringify(got) !== JSON.stringify(want))
          return { pass: false, score: 0, reason: `Milestones SP column is [${sps.join(', ')}], expected the plan's [${expected.join(', ')}]` };
        const sum = sps.reduce((a, b) => a + b, 0);
        if (sum !== 44)
          return { pass: false, score: 0, reason: `Milestones SPs sum to ${sum}, expected 44` };
        const tSection = /## Totals\n([\s\S]*?)(?:\n## |\n?$)/.exec(content);
        if (!tSection) return { pass: false, score: 0, reason: 'no Totals section' };
        if (!/44/.test(tSection[1]) || !/35/.test(tSection[1]) || !/\bover\b/i.test(tSection[1]))
          return { pass: false, score: 0, reason: `Totals does not state 44 SP over the 35 SP threshold: ${tSection[1].trim()}` };
        return { pass: true, score: 1, reason: `Milestones SPs ${sps.join(', ')} sum to 44, Totals states it over the 35 SP threshold` };
    # RETURN-SHAPE
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        sections:
          - name: Changed
            entry: '^-\s+\[(CREATED|UPDATED)\]\s+`?([^`\s]+)`?$'
            statuses: [CREATED]
            matchManifest: true
            maxEntries: 1
          - name: Notes
            entry: '^-\s+\S'
            minEntries: 1
          - name: Questions
            entry: '^\d+\.\s+.+'
            minEntries: 2
            maxEntries: 2
        onlyListed: true

- description: present regress — grounding and fidelity on over-threshold-local
  vars:
    input: file://_fixtures/over-threshold-local.md
  metadata:
    playbook: groom
    step: present
    fixture: over-threshold-local
    tier: regress
  assert:
    - type: llm-rubric
      value: "SP-ARITHMETIC: the milestone SPs sum to the stated 44 and that total is the plan's own — present re-sums, never re-estimates."
    - type: llm-rubric
      value: "CHECKS-OUTCOMES: each Checks entry states what was found and what became of it — CRITICAL folded into milestone 2, 2 NOTEs deferred to the risk register, `redis-py` floor 4.6 → 5.0 — never a bare \"passed\"."
    - type: llm-rubric
      value: "APPROACH-FROM-DESIGN: Approach restates the confirmed design's decision and its consequences in the user's terms and introduces no architecture call the design did not make."
    - type: llm-rubric
      value: "ONE-SCREEN: the summary is decidable end to end without opening the plan, and no section drops to the plan's task-level detail."

- description: present smoke — first pass, under threshold on under-threshold-plain
  vars:
    input: file://_fixtures/under-threshold-plain.md
  metadata:
    playbook: groom
    step: present
    fixture: under-threshold-plain
    tier: smoke
  assert:
    # FILE-AT-PATH
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        onTextMode: fail
        expect:
          - path: '_runs/groom/20260801-10-30_plan-summary-frontmatter/handoff\.md$'
            minLines: 10
            contains: ['^# handoff — 20260801-10-30_plan-summary-frontmatter$']
        noOthers: true
    # NO-SPLIT-SECTION (shape, via strict heading set) + NO-BRANCH-SECTION (shape) +
    # CHECKS-STILL-THREE (shape)
    - type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'handoff\.md$'
        rules: |
          - select: H1 > H2
            ordered: [Approach, Milestones, Totals, Plan, Checks, Next]
            strict: true

          - select: SECTION("Totals")
            require: '18'
          - select: SECTION("Totals")
            require: '35'

          - select: SECTION("Checks") > UL > LI
            count: 3
            match: '(?s)^\*\*(Decomposition|Cross-review|References)\*\*.*'
    # NO-BRANCH-SECTION (return side: no git switch -c line in Notes)
    - type: javascript
      value: |
        const m = /<return>\n([\s\S]*?)\n<\/return>/.exec(output);
        if (!m) return { pass: false, score: 0, reason: 'no <return> block' };
        if (/git switch -c/.test(m[1]))
          return { pass: false, score: 0, reason: 'return carries a `git switch -c` line on a vault outside the repo' };
        return { pass: true, score: 1, reason: 'no git switch -c line in the return' };
    # QUESTIONS-APPROVAL-ONLY + RETURN shape
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        sections:
          - name: Changed
            entry: '^-\s+\[(CREATED|UPDATED)\]\s+`?([^`\s]+)`?$'
            statuses: [CREATED]
            matchManifest: true
            maxEntries: 1
          - name: Notes
            entry: '^-\s+\S'
            minEntries: 1
          - name: Questions
            entry: '^\d+\.\s+.+'
            minEntries: 1
            maxEntries: 1
        onlyListed: true

