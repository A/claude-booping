  metadata:
    playbook: groom
    step: present
    fixture: returned-after-rework
    tier: smoke
  assert:
    # FRONTMATTER-PRESERVED
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        onTextMode: fail
        expect:
          - path: '_runs/groom/20260731-14-02_rate-limit-public-api/handoff\.md$'
            minLines: 15
            contains:
              - '^# handoff — 20260731-14-02_rate-limit-public-api$'
              - '^reviewed_at: null$'
        noOthers: true
    # UPDATED-IN-PLACE (same H1/H2 set, no round or revision section appended) + CHANGED-MARKED
    - type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'handoff\.md$'
        rules: |
          - select: H1 > H2
            ordered: [Approach, Milestones, Totals, Plan, Checks, "Split recommendation", Branch, Next]
            strict: true

          - select: SECTION("Milestones")
            require: '\*\*Changed this round'
          - select: SECTION("Totals")
            require: '\*\*Changed this round'
          # sections whose inputs did not move this round. Not Checks: the fixture re-ran the
          # decomposition pass, so that entry legitimately carries the mark.
          - select: SECTION("Approach")
            forbid: '\*\*Changed this round'
          - select: SECTION("Plan")
            forbid: '\*\*Changed this round'
          - select: SECTION("Branch")
            forbid: '\*\*Changed this round'
    # UPDATED-IN-PLACE (return: [UPDATED], matches the seeded handoff.md) + QUESTIONS-REASKED
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        sections:
          - name: Changed
            entry: '^-\s+\[(CREATED|UPDATED)\]\s+`?([^`\s]+)`?$'
            statuses: [UPDATED]
            matchManifest: true
            seededVar: input
            maxEntries: 1
          - name: Notes
            entry: '^-\s+\S'
            minEntries: 1
          - name: Questions
            entry: '^\d+\.\s+.+'
            minEntries: 2
            maxEntries: 2
        onlyListed: true

