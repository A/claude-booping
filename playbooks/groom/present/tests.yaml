- description: present smoke — change request handed back on absorbable-change
  vars:
    input: file://_fixtures/absorbable-change.md
  metadata:
    playbook: groom
    step: present
    fixture: absorbable-change
    tier: smoke
  assert:
    # TRAP-PLAN-UNTOUCHED (noOthers: a modified/listed plans/*.md fails it) + no plan file in
    # the Changed manifest. handoff.md is `allow`, not `expect`, and an empty manifest passes:
    # the summary still describes the round under review, so a rewrite of it is byte-identical
    # and the provider collects nothing. Requiring a file here would require present to edit the
    # summary — the exact thing this trap forbids.
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        onTextMode: pass
        allow:
          - '_runs/groom/20260731-14-02_rate-limit-public-api/handoff\.md$'
        noOthers: true
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        sections:
          - name: Changed
            entry: '^-\s+\[(CREATED|UPDATED)\]\s+`?([^`\s]+)`?$'
            matchManifest: true
            seededVar: input
            minEntries: 0
            maxEntries: 1
          - name: Notes
            entry: '^-\s+\S'
            minEntries: 1
          - name: Questions
            entry: '^\d+\.\s+.+'
            minEntries: 0
        onlyListed: true
    # TRAP-NO-SELF-EDIT — the round under review still shows 4 milestones summing 44 SP; the
    # requested merge (2 SP off milestone 1, milestones 2+3 folded) is not applied
    - type: javascript
      value: |
        const fm = /<file path="_runs\/groom\/20260731-14-02_rate-limit-public-api\/handoff\.md">\n([\s\S]*?)\n<\/file>/.exec(output);
        if (!fm) return { pass: true, score: 1, reason: 'handoff.md unwritten this round — nothing to check (a change request may be handed back before any rewrite)' };
        const content = fm[1];
        const mSection = /## Milestones\n([\s\S]*?)(?:\n## |\n?$)/.exec(content);
        if (!mSection) return { pass: false, score: 0, reason: 'no Milestones section' };
        const sps = [...mSection[1].matchAll(/\|\s*\d+\s*\|[^|]*\|\s*(\d+)\s*\|/g)].map((m) => Number(m[1]));
        const expected = [8, 12, 9, 15];
        const got = [...sps].sort((a, b) => a - b);
        const want = [...expected].sort((a, b) => a - b);
        if (JSON.stringify(got) !== JSON.stringify(want))
          return { pass: false, score: 0, reason: `Milestones SP column is [${sps.join(', ')}] — the requested merge/cut was applied; expected the round-under-review's own [${expected.join(', ')}]` };
        return { pass: true, score: 1, reason: `Milestones SPs unchanged at ${sps.join(', ')}` };

