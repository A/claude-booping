state: run
graph:
  intake: []
  prepare: [intake]
  gather-feedback: [prepare]
  research-issues: [gather-feedback]
  synthesize: [research-issues]
  save: [synthesize]

states:
  run:
    artifact: index.md
    initial: awaiting-retro
    statuses:
      awaiting-retro:
        transitions:
          - to: awaiting-learning
            when: "save wrote the approved `retro.md` into the primary plan's directory and linked the sibling plans to it"
            gates:
              - "explicit user approval of the draft captured at synthesize — \"save it\" counts, silence never does"
              - "`retro.md`'s `plans:` list covers the whole working set and `goal_verdicts:` carries a verdict for each, since the hook script reads both"
            hooks: ["frontmatter-update retro.md reviewed_at=@now", "script close-working-set"]
      awaiting-learning:
        terminal: true

    superstates:
      terminal:
        states:
          - awaiting-learning
