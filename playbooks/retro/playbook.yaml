state: run
graph:
  intake: []
  prepare: [intake]
  gather-feedback: [prepare]
  research-issues: [gather-feedback]
  synthesize: [research-issues]
  save: [synthesize]

states:
  run:
    initial: awaiting-retro
    statuses:
      awaiting-retro:
        transitions:
          - to: awaiting-learning
            when: "save wrote the approved retrospective to `retrospectives/{slug}.md`, the run's `--target`"
            gates:
              - "explicit user approval of the draft captured at synthesize — \"save it\" counts, silence never does"
              - "the retrospective's `plans:` list covers the whole working set and `goal_verdicts:` carries a verdict for each, since the hook script reads both"
            hooks:
              - frontmatter-update reviewed_at="{{ macro('core.macros.date', '+%Y-%m-%d %H:%M') }}"
              - script close-working-set --verdicts --prefix retro --stage retrospectives
      awaiting-learning:
        terminal: true

    superstates:
      terminal:
        states:
          - awaiting-learning
