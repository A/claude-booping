graph:
  guide: []

states:
  # Lifecycle of one open item. The workdir is the vault; every edge is
  # `booping transition {vault}/open-items/OI-NNNN.md <to>`, the machine inferred
  # from the path. The `specs` run itself never moves one.
  open_item:
    standalone: true
    artifact: open-items/{instance}.md
    initial: open
    statuses:
      open:
        transitions:
          - to: planned
            when: "`booping set {item} plan={plan index}` linked the item to a plan"
            gates: ["`plan` names an existing plan file"]
          - to: done
            when: "an open item closed without a plan — a tiny fix, an answered question or a recorded decision closed without a plan"
            hooks:
              - set closed_at="{{ macro('core.macros.date', '+%Y-%m-%d') }}"
          - to: dropped
            when: "the item closed without work, `booping set {item} reason=…` first when there is one"
            hooks:
              - set closed_at="{{ macro('core.macros.date', '+%Y-%m-%d') }}"
          - to: clarify
            when: "the item asks the user a question, written in its body"
      clarify:
        transitions:
          - to: open
            when: "the user answered, the answer written in the item's body"
      planned:
        transitions:
          - to: done
            when: "the item closed by hand, or the linked plan reached develop's `done`"
            hooks:
              - set closed_at="{{ macro('core.macros.date', '+%Y-%m-%d') }}"
          - to: dropped
            when: "the item closed without work, `booping set {item} reason=…` first when there is one"
            hooks:
              - set closed_at="{{ macro('core.macros.date', '+%Y-%m-%d') }}"
          - to: open
            when: "the item reopened by hand, or the linked plan failed or was cancelled"
            hooks:
              - set plan=null
      done: {terminal: true}
      dropped: {terminal: true}
