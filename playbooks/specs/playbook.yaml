graph:
  guide: []

states:
  # Lifecycle of one open item. The workdir is the vault; `booping items` moves it,
  # except the `clarify` edges: `booping playbook-transition specs <to> --state
  # open_item --target {vault}/open-items/OI-NNNN.md`. The `specs` run never does.
  open_item:
    standalone: true
    artifact: open-items/{instance}.md
    initial: open
    statuses:
      open:
        transitions:
          - to: planned
            when: "`booping items plan` linked the item to a plan"
            gates: ["`plan` names an existing plan file"]
          - to: done
            when: "`booping items close` on an open item — a tiny fix, an answered question or a recorded decision closed without a plan"
            hooks:
              - frontmatter-update closed_at="{{ macro('core.macros.date', '+%Y-%m-%d') }}"
          - to: dropped
            when: "`booping items close --dropped` closed the item without work"
            hooks:
              - frontmatter-update closed_at="{{ macro('core.macros.date', '+%Y-%m-%d') }}"
          - to: clarify
            when: "the item asks the user a question, written in its body"
      clarify:
        transitions:
          - to: open
            when: "the user answered, the answer written in the item's body"
      planned:
        transitions:
          - to: done
            when: "`booping items close`, or the linked plan reached develop's `done`"
            hooks:
              - frontmatter-update closed_at="{{ macro('core.macros.date', '+%Y-%m-%d') }}"
          - to: dropped
            when: "`booping items close --dropped` closed the item without work"
            hooks:
              - frontmatter-update closed_at="{{ macro('core.macros.date', '+%Y-%m-%d') }}"
          - to: open
            when: "`booping items reopen`, or the linked plan failed or was cancelled"
            hooks:
              - frontmatter-update plan=null
      done: {terminal: true}
      dropped: {terminal: true}
