# Six smoke cases over the guide step. The run has no shell: each fixture states the
# `booping` outputs a live run would have read, and stands in for the writes the CLI would
# have made. The cwd is the vault root; the project tier, when there is one, is `specs/`.

- description: guide smoke — no project tier, the reply offers init and the alignment guide
  vars:
    input: file://_fixtures/init-offer.md
  metadata:
    playbook: specs
    step: guide
    fixture: init-offer
    tier: smoke
  assert:
    # NO-TIER-WRITE — init waits for the user's yes, so nothing lands under a specs/ dir
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        expect: []
        allow:
          - '^(?!(?:.*/)?specs/)'
        noOthers: true
    # OFFERS-INIT
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        entry: '\b[Ii]nit'
        onlyEntries: false
        minEntries: 1
    # OFFERS-ALIGNMENT
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        entry: '[Aa]lignment'
        onlyEntries: false
        minEntries: 1

- description: guide smoke — a stated decision lands as an ADR plus its open item, unasked
  vars:
    input: file://_fixtures/record-decision.md
  metadata:
    playbook: specs
    step: guide
    fixture: record-decision
    tier: smoke
  assert:
    # WRITE-SET — the ADR and the item its confirmation line files, nothing else
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        onTextMode: fail
        expect:
          - path: '^specs/adr/0001-[a-z0-9-]+\.md$'
            contains:
              - '^created_by: claude\s*$'
              - 'Confirmation:'
            forbids:
              - '^reviewed:'
          - path: '^open-items/OI-0001\.md$'
            contains:
              - '^id: OI-0001\s*$'
              - '^status: open\s*$'
              - '^source: adr\s*$'
              - '^record: adr/0001'
        noOthers: true
    # ADR-SHAPE — the shipped ADR schema, read from its one source
    - type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: '^specs/adr/0001-[a-z0-9-]+\.md$'
        rulesFile: src/specs/schemas/adr.yaml
    # NO-WHICH-ACTION — the guide acts on the request, never asks which scenario to run
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        entry: '[Ww]hich (action|scenario|one)'
        onlyEntries: false
        minEntries: 0
        maxEntries: 0

- description: guide smoke — what is open lists both open items and writes nothing
  vars:
    input: file://_fixtures/what-is-open.md
  metadata:
    playbook: specs
    step: guide
    fixture: what-is-open
    tier: smoke
  assert:
    # READ-ONLY
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        expect: []
        noOthers: true
    # BOTH-IDS
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        entry: 'OI-0001'
        onlyEntries: false
        minEntries: 1
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        entry: 'OI-0002'
        onlyEntries: false
        minEntries: 1

- description: guide smoke — autonomous, work the open items chains groom and develop unasked
  vars:
    input: file://_fixtures/autonomous-open-items.md
  metadata:
    playbook: specs
    step: guide
    fixture: autonomous-open-items
    tier: smoke
  assert:
    # NO-SPECS-WRITE — the items go to groom; nothing lands under a specs/ dir
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        expect: []
        allow:
          - '^(?!(?:.*/)?specs/)'
        noOthers: true
    # GROOM-THEN-DEVELOP — groom names both ids, develop follows
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        entry: '/playbook groom'
        onlyEntries: false
        minEntries: 1
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        entry: 'OI-0001'
        onlyEntries: false
        minEntries: 1
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        entry: 'OI-0002'
        onlyEntries: false
        minEntries: 1
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        entry: '/playbook develop'
        onlyEntries: false
        minEntries: 1
    # ASKS-NOTHING — no line ends in a question, an item title quoted by id aside
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        entry: '^(?!.*OI-\d{4}).*\?\W*$'
        onlyEntries: false
        minEntries: 0
        maxEntries: 0

- description: guide smoke — recording an ADR ends with the brief in its locked shape and the objection ask
  vars:
    input: file://_fixtures/record-adr-brief.md
  metadata:
    playbook: specs
    step: guide
    fixture: record-adr-brief
    tier: smoke
  assert:
    # PROPOSED-DRAFT — the ADR waits for the answer: proposed, no review level yet
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        onTextMode: fail
        expect:
          - path: '^specs/adr/0001-[a-z0-9-]+\.md$'
            contains:
              - '^status: proposed\s*$'
            forbids:
              - '^review:'
              - '^reviewed:'
        noOthers: true
    # BRIEF-TABLE — a chosen row and a rejected row
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        entry: '^\|\s*✔\s*\|'
        onlyEntries: false
        minEntries: 1
        maxEntries: 1
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        entry: '^\|\s*✘\s*\|'
        onlyEntries: false
        minEntries: 1
    # BRIEF-PARTS
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        entry: '^[*_\s]*Ключевые моменты:'
        onlyEntries: false
        minEntries: 1
    # NOT-WEIGHED — the scorer's one `missing` entry on its own line
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        entry: '^[*_\s]*Не взвешено:.*\S'
        onlyEntries: false
        minEntries: 1
        maxEntries: 1
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        entry: '^[*_\s]*Задевает:'
        onlyEntries: false
        minEntries: 1
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        entry: '^[*_\s]*Решил сам:'
        onlyEntries: false
        minEntries: 1
    # OBJECTION-ASK — the gentle line, verbatim
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        entry: 'Если что-то не так — скажи, поправлю; если всё ок — продолжаю\.'
        onlyEntries: false
        minEntries: 1

- description: guide smoke — a draft the scorer routes to a rule writes no ADR and shows the route
  vars:
    input: file://_fixtures/record-adr-routed.md
  metadata:
    playbook: specs
    step: guide
    fixture: record-adr-routed
    tier: smoke
  assert:
    # NO-ADR — route ≠ adr blocks the ADR file; the routed rule may be drafted
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        expect: []
        allow:
          - '^(?!specs/adr/)'
        noOthers: true
    # NO-BRIEF — a routed draft gets no ADR brief
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        entry: '^\s*\*\*ADR \d{4} —'
        onlyEntries: false
        minEntries: 0
        maxEntries: 0
    # ROUTE-SHOWN — a line naming the route and its reason
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        entry: '\b[Rr]ule\b.{20,}'
        onlyEntries: false
        minEntries: 1
