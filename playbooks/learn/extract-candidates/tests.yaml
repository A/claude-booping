# The output contract is one markdown table: # | Rule | Example | Target | Lands at | Targets | Brief.
# Finding 6 spans two targets and must split, so 6 findings yield at least 7 rows.

- description: extract smoke — table shape and target vocabulary
  vars:
    input: file://_fixtures/retro-findings.md
  metadata:
    playbook: learn
    step: extract-candidates
    fixture: retro-findings
    tier: smoke
  assert:
    # TABLE-SHAPE — a header row plus at least 7 candidate rows (finding 6 splits)
    - type: javascript
      value: "output.split('\\n').filter(l => /^\\s*\\|/.test(l)).length >= 9"
    # RULE-ROWS — a Brief column, and at least one Rule-destination row whose Lands at is a
    # rule record path and whose Targets and Brief cells are filled
    - type: javascript
      value: |
        const rows = output.split('\n').filter(l => /^\s*\|/.test(l))
          .map(l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
        const header = rows.find(r => r.includes('Brief') && r.includes('Target'));
        if (!header) return { pass: false, score: 0, reason: 'no header row with Target and Brief columns' };
        const col = (n) => header.indexOf(n);
        const body = rows.filter(r => r !== header && !r.every(c => /^:?-+:?$/.test(c)));
        const rules = body.filter(r => (r[col('Target')] || '').replace(/[`*]/g, '') === 'Rule');
        if (!rules.length) return { pass: false, score: 0, reason: 'no row routed to the Rule destination' };
        const bad = rules.filter(r => !/rule\/\S*-[a-z0-9-]+\.md/.test(r[col('Lands at')] || '')
          || !(r[col('Targets')] || '').replace(/[—-]/g, '').trim()
          || !(r[col('Brief')] || '').replace(/[—-]/g, '').trim());
        return bad.length
          ? { pass: false, score: 0, reason: `${bad.length} Rule row(s) lack a rule path, Targets or Brief` }
          : { pass: true, score: 1, reason: `${rules.length} Rule rows carry a rule path, Targets and Brief` };
    # VOCAB — both destinations and agent wiring show up
    - type: regex
      value: 'agent:booping-developer'
    - type: regex
      value: 'CLAUDE\.md'
    # NO-LESSON-PATH — nothing lands in the retired lesson directory
    - type: not-regex
      value: '[_]lessons/'
    # NO-GLOBAL-SCOPE — never the user-level file
    - type: not-regex
      value: '~/\.claude'
    # NO-INVENTED-STEPS — step-scoped wiring only uses steps the target space lists
    - type: javascript
      value: |
        const known = new Set(['groom','develop','retro','learn']);
        const steps = {
          groom: ['intake','research-codebase','research-web','draft-plan','cross-review','present'],
          develop: ['intake','provision','develop-loop','verify','wrap-up'],
          retro: ['intake','prepare','gather-feedback','research-issues','synthesize','save'],
          learn: ['intake','extract-candidates','dedup-sweep','review-table','write','transition'],
        };
        const refs = [...output.matchAll(/\b(groom|develop|retro|learn)\/([a-z-]+)/g)];
        return refs.every(m => steps[m[1]].includes(m[2]));

- description: extract regress — routing judgment on tricky findings
  vars:
    input: file://_fixtures/retro-findings.md
  metadata:
    playbook: learn
    step: extract-candidates
    fixture: retro-findings
    tier: regress
  assert:
    - type: llm-rubric
      value: "ROUTE-USER-TESTING-TO-GROOM: The candidate from finding 1 (a user-testing step must pass before the sprint closes) is routed to grooming — a rule whose Targets wiring names `groom` or a groom step (e.g. `groom/draft-plan`) — because grooming owns the plan's content and DoD, even though the finding was observed at develop time. Fails if the candidate is wired to `develop`, its steps, or an agent instead."
    - type: llm-rubric
      value: "ROUTE-BRANCHING-TO-DEVELOP: The candidate from finding 2 (commit straight to master, never create branches) reaches develop's branching behavior — a rule wired to `develop` or `develop/provision`, or `agent:booping-developer` — because develop owns git mechanics. Fails if it is wired to groom, retro, or the repo CLAUDE.md as the sole target."
    - type: llm-rubric
      value: "ROUTE-RULE-AUDIT-TO-RETRO: The candidate from finding 3 (check which existing rules were applicable and flag the unused ones) is routed to retro — a rule wired to `retro` or a retro step such as `retro/research-issues`. Fails if it lands in learn, groom, or develop."
    - type: llm-rubric
      value: "ROUTE-REPO-FACTS-TO-CLAUDEMD: Finding 4's project facts (`just api` starts the API, `just e2e` runs the e2e tests) are routed to the Repository CLAUDE.md target as one-bullet project facts, not turned into a rule. Fails if they land anywhere else."
    - type: llm-rubric
      value: "SPLIT-SPANNING-FINDING: Finding 6 yields two distinct rows — one for plans carrying a rollback note per migration (routed to grooming), one for rehearsing migrations against a database copy (routed to develop's execution side: a rule wired to develop or to `agent:booping-developer`). Fails if both rules sit in one row, or if the same rule is duplicated across two targets."
    - type: llm-rubric
      value: "ATOMIC-IMPERATIVE: Every Rule cell is a single imperative sentence stating one concern — no 'and'-joined double rules, no descriptive 'X happened' phrasing — and every Example cell is one sentence. Fails if any cell breaks these constraints."
    - type: llm-rubric
      value: "SINGLE-TARGET-ROWS: Every row lands in exactly one target kind with one resolved path; no row names two files, and no rule appears under two different targets. A rule row's Targets cell may list several playbook/step/agent entries — that is one rule, not a violation."
