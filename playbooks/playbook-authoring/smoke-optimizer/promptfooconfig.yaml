# smoke-optimizer step — diagnose a red smoke report, edit the guilty side; the harness runs
# the tier. output_mode: files — the consumer edits the seeded step tree in place.
# allow_no_files: the ambiguous fixture's correct outcome is ZERO edits plus a question, which
# the provider would otherwise reject as a misread task.
description: playbook-authoring smoke-optimizer

prompts:
  - id: file://opus-5.md
    label: opus-5

providers:
  - id: file://../../_lib/claude_provider.py
    config:
      mode: step
      context:
        - _lib/return-contract.md
      output_mode: files
      allow_no_files: true
      model: opus
      effort: medium

defaultTest: file://../../_lib/grader.yaml

tests: file://tests.yaml
