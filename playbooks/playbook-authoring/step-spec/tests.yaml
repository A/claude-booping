- description: step-spec smoke — spec contract for compose
  vars:
    target: compose
    input: file://_fixtures/compose-from-decomposition.md
  metadata:
    playbook: playbook-authoring
    step: step-spec
    fixture: compose-from-decomposition
    tier: smoke
  assert:
    # FILE-AT-PATH + FIVE-BULLETS (index update allowed by the backlink rule)
    - type: javascript
      value: file://../../_lib/asserts/files.js
      config:
        onTextMode: fail
        expect:
          - path: 'mod-review/_specs/steps/compose/index\.md$'
            contains:
              - '\*\*Needs\*\*'
              - '\*\*Value\*\*'
              - '\*\*Output files\*\*'
              - '\*\*Harness return\*\*'
              - '\*\*Review gate\*\*'
              - '\[← index\]'
        allow: ['mod-review/_specs/index\.md$']
        noOthers: true
    # SECTIONS
    - type: javascript
      value: file://../../_lib/asserts/mdcheck.js
      config:
        file: 'mod-review/_specs/steps/compose/index\.md$'
        rules: |
          - select: H1
            count: 1

          - select: H1 > H2
            ordered: [Contract, Example artifact, Return Format]
            strict: true

          - select: SECTION("Contract") > UL > LI
            min: 5
    - type: javascript
      value: file://../../_lib/asserts/return.js
      config:
        requireBlock: true
        sections:
          - name: Changed
            entry: '^-\s+\[(CREATED|UPDATED)\]\s+`?([^`\s]+)`?$'
            matchManifest: true
            seededVar: input
          - name: Questions
            optional: true
            maxEntries: 0
        onlyListed: true

- description: step-spec regress — contract fidelity for compose
  vars:
    target: compose
    input: file://_fixtures/compose-from-decomposition.md
  metadata:
    playbook: playbook-authoring
    step: step-spec
    fixture: compose-from-decomposition
    tier: regress
  assert:
    - type: llm-rubric
      value: "CONTRACT-GROUNDED: The contract reflects the decomposition's compose row — the output file is `_review/review.md`, the review gate is the user confirming findings, and the value restates composing per-file findings into one signed-off report. The example artifact is a compact fenced review report consistent with the contract. Fails if the artifact path, gate or purpose drifts from the decomposition."
    - type: llm-rubric
      value: "NEEDS-BLIND: The Needs bullet lists INFORMATION only — the findings and module content the step consumes — never upstream step names ('sweep's output') or artifact paths ('_review/<file>.md'). Fails if any Needs item names a step or a path."
