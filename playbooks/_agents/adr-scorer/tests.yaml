    input: file://_fixtures/adr-0019-score-1.md
    compare: file://_fixtures/adr-0003-score-3.md
  metadata:
    agent: adr-scorer
    fixture: adr-0019-below-adr-0003
    tier: regress
  assert:
    # ORDER — the weaker ADR scores strictly lower
