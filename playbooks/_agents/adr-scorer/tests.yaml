# The adr-scorer agent over booping-only draft ADRs, each with its frozen record inventory.
#
# Fixtures: adr-0005, adr-0012, adr-0013 recovered from commit 19a984f^ (deleted in 19a984f);
# adr-0003, adr-0019, adr-0024 and the sources of the mutant-* fixtures from commit 5ea9393, verbatim.
# A mutant cuts one cheap option — its Alternatives row, its section and its Context line — and
# names the cut in `metadata.cut`; mutant-0033 is also shown as a draft (status proposed, the
# superseded note dropped) and one other project's name is neutralised.
#
# Inventory: inventory-adr-{NNNN}.txt is the output of
#   bin/booping specs ls --tier project --type value --type rule --type adr --titles --exclude adr/{NNNN}
# run in a tree of the fixture ADR's commit (19a984f^ or 5ea9393, with the repo's .booping marker),
# with every line whose record `created_at` is after the ADR's dropped.
# Primitives: primitives.md, one line per command or building block of CLAUDE.md `## Commands`.
#
# Expectations are hand-derived: the deleted ADRs route to rule / none / value; the kept ones
# route to adr with alt_score 1 / 2 / 3 (vault/plans/202610190033_specs-acceptance-and-session-entry/
# adr-audit-ground-truth.md); each mutant's `missing` names its cut option.
# smoke: zero tool calls and the JSON contract on every fixture. regress: route on every fixture,
# alt_score within ±1 on the kept ones, alt_score of 0019 below 0003, a judge per mutant.

- description: adr-scorer smoke — ADR 0012 (deleted), the driver owns the vault
  vars:
    input: file://_fixtures/adr-0012.md
    inventory: file://_fixtures/inventory-adr-0012.txt
    primitives: file://_fixtures/primitives.md
  metadata:
    agent: adr-scorer
    fixture: adr-0012
    tier: smoke
  assert:
    # NO-TOOLS — the agent reads nothing beyond its prompt
    - type: javascript
      value: file://asserts.js
      config:
        check: tools
    # CONTRACT — one JSON line, the rubric's keys, enum and ranges
    - type: javascript
      value: file://asserts.js
      config:
        check: contract

- description: adr-scorer regress — ADR 0012 (deleted), the driver owns the vault
  vars:
    input: file://_fixtures/adr-0012.md
    inventory: file://_fixtures/inventory-adr-0012.txt
    primitives: file://_fixtures/primitives.md
  metadata:
    agent: adr-scorer
    fixture: adr-0012
    tier: regress
  assert:
    # ROUTE — exactly the hand-derived type
    - type: javascript
      value: file://asserts.js
      config:
        check: route
        expect: rule

